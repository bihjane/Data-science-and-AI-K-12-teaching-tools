l>\n<h2>Troubleshooting<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NameError: name 'input_tokens' is not defined<\/td>\n<td>Step 2 failed. Finish estimate_tokens() and run Step 2 again.<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost is in the thousands<\/td>\n<td>You forgot to divide by 1,000,000. Prices are per million tokens.<\/td>\n<\/tr>\n<tr>\n<td>Token estimate is a decimal<\/td>\n<td>Use math.ceil() to round up to a whole token.<\/td>\n<\/tr>\n<tr>\n<td>Step 5 fails to install<\/td>\n<td>The runtime has no internet. Run it in Colab, or leave Step 5 off.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Self-check<\/h2>\n<ul>\n<li>My monthly cost matches $2.19 for the sample inputs.<\/li>\n<li>I can explain why output tokens take most of the budget.<\/li>\n<li>I priced one task from my own work and wrote down one way to halve the cost.<\/li>\n<\/ul>", "C3-M01-L03-lesson": "<h2>Lesson objectives<\/h2>\n<ol>\n<li>Explain why language models produce confident statements that are false, often called hallucinations.<\/li>\n<li>Name the common types of made-up content: facts, numbers, sources and misreadings.<\/li>\n<li>Apply four checks to catch made-up content before it reaches someone who relies on it.<\/li>\n<\/ol>\n<h2>1. Hook<\/h2>\n<p>In 2023, a US federal judge in New York sanctioned two lawyers in the case <em>Mata v. Avianca<\/em>. Their court filing cited six earlier cases to support their argument. None of the six existed. The lawyers had used ChatGPT to research the brief and had not checked the citations. When asked, the tool had even assured them the cases were real.<\/p>\n<p><strong>Think about it:<\/strong> the tool produced realistic case names, quotes and citation numbers. How could it do that for cases that never happened?<\/p>\n<h2>2. Explain<\/h2>\n<h3>Why it happens<\/h3>\n<p>From Lesson 1: a language model writes by predicting likely next tokens. It is built to produce text that fits the pattern of a good answer. When it has the real information, the likely text is usually correct. When it does not, the likely text can still look exactly like a correct answer: a case name in the right format, a plausible percentage, a policy that sounds standard.<\/p>\n<p>Common causes:<\/p>\n<ul>\n<li><strong>Missing information.<\/strong> The fact was never in its training data, or it is your organization's private policy.<\/li>\n<li><strong>Outdated information.<\/strong> The training data stops at a cutoff date, and the world has changed since.<\/li>\n<li><strong>Pressure to answer.<\/strong> Models are trained to be helpful, and the prompt often assumes an answer exists.<\/li>\n<li><strong>Misreading the source.<\/strong> Even with the right document, a model can mix up two numbers or attach a rule to the wrong case.<\/li>\n<\/ul>\n<h3>What made-up content looks like<\/h3>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Invented fact<\/td>\n<td>A clinic chatbot says payment plans run for 12 months; the policy says 6.<\/td>\n<\/tr>\n<tr>\n<td>Invented number<\/td>\n<td>A marketing summary reports \"a 23% lift\" that appears in no report.<\/td>\n<\/tr>\n<tr>\n<td>Invented source<\/td>\n<td>A research summary cites a journal article that does not exist.<\/td>\n<\/tr>\n<tr>\n<td>Misread source<\/td>\n<td>A finance assistant applies the travel-expense limit to software purchases.<\/td>\n<\/tr>\n<tr>\n<td>Confident guess<\/td>\n<td>A help-desk bot gives exact steps for a software version that was never released.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Confidence and tone tell you nothing. Wrong sentences read exactly like right ones.<\/p>\n<h3>Four checks that catch most of it<\/h3>\n<ol>\n<li><strong>Give it the source.<\/strong> Paste or retrieve the document the answer should come from, and tell the model to answer only from it. This is the idea behind RAG, which you build in Module 6.<\/li>\n<li><strong>Allow \"I don't know\".<\/strong> Tell the model that \"The document does not say\" is an acceptable answer. This reduces pressure to invent.<\/li>\n<li><strong>Check the checkable details.<\/strong> Numbers, dates, names, amounts and citations are where invented content most often hides, and they are the easiest to verify.<\/li>\n<li><strong>Match review to the stakes.<\/strong> A brainstorm needs no review. A customer letter about money, health or grades needs a person to verify every fact before it is sent.<\/li>\n<\/ol>\n<h3>Key terms in plain language<\/h3>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Hallucination (made-up content)<\/strong><\/td>\n<td>When a model states something false or invented, such as a source that does not exist, in the same confident tone as true facts.<\/td>\n<\/tr>\n<tr>\n<td><strong>Grounding<\/strong><\/td>\n<td>Giving the model trusted material, such as your own documents, and asking it to answer only from that material. It reduces made-up content.<\/td>\n<\/tr>\n<tr>\n<td><strong>Citation<\/strong><\/td>\n<td>A pointer to the exact source of a claim, so a reader can check it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Verification<\/strong><\/td>\n<td>Checking a claim against a reliable source before you use it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. Demonstrate<\/h2>\n<ol>\n<li>In Google AI Studio, ask: \"What is the late fee in Riverside Family Clinic's billing policy?\" The clinic is fictional, so any specific fee the model gives is made up.<\/li>\n<li>Paste the fictional policy from the lab and ask again with the instruction: \"Answer only from this policy. If the policy does not say, reply 'The policy does not say.'\" Compare.<\/li>\n<li>Ask for an answer with a citation to the line of the policy that supports it. A citation makes checking fast.<\/li>\n<li>Results vary between runs. If the model declines to invent in step 1, that is good behavior, and it shows why you test rather than assume.<\/li>\n<\/ol>\n<h2>4. Practice<\/h2>\n<p>Complete the lab <strong>Catch the made-up answer<\/strong>.<\/p>\n<h2>5. Check<\/h2>\n<p>Take the lesson quiz.<\/p>\n<h2>6. Apply<\/h2>\n<p>Take a short, non-confidential policy or procedure from your field and write three questions about it: one the policy answers, one it answers only partly, and one it does not answer. Ask an AI tool each question twice, once without the policy and once with it plus the \"answer only from this\" instruction, and record what changed.<\/p>\n<p>Then write a one-paragraph review rule for your team: which AI outputs need a human fact check before use, and who does it.<\/p>", "C3-M01-L03-lab": "<h2>Purpose<\/h2>\n<p>Check an AI answer line by line against the policy it was supposed to use, and flag details the policy does not support. Then try to write a false sentence that slips past the check, which shows why automated checks support human review rather than replace it.<\/p>\n<h2>Files<\/h2>\n<ul>\n<li><strong>Starter notebook<\/strong>: <code>labs/C03-M01-L03-Why models make things up Lab Starter-v1.ipynb<\/code><\/li>\n<li><strong>Solution notebook<\/strong>: <code>labs/C03-M01-L03-Why models make things up Lab Solution-v1.ipynb<\/code><\/li>\n<\/ul>\n<h2>Requirements<\/h2>\n<ul>\n<li>Google Colab or Python 3.12 or later.<\/li>\n<li>Libraries: Python standard library only (re).<\/li>\n<li>Time: 20 minutes.<\/li>\n<li>The clinic and its policy are fictional. The lab covers billing administration only, not medical advice.<\/li>\n<\/ul>\n<h2>Setup steps<\/h2>\n<ol>\n<li>Upload the starter notebook to Colab (<strong>File &gt; Upload notebook<\/strong>) or open it in Jupyter.<\/li>\n<li>Complete the TODO cells: <code>details()<\/code> and <code>word_support()<\/code>.<\/li>\n<li>Choose <strong>Runtime &gt; Run all<\/strong>.<\/li>\n<li>Do the \"Try to beat the checker\" task at the end of the notebook.<\/li>\n<\/ol>\n<h2>Expected output<\/h2>\n<p>Output of the solution notebook, run on Python 3.13.<\/p>\n<pre><code>['$200', '6']\nok    You will receive a statement 14 days after your visit.\nCHECK Payment is due within 45 days of the statement date.\n      -&gt; details not in source: 45\nCHECK Payment plans are available for balances over $200 and can run for up to 12 months.\n      -&gt; details not in source: 12\nCHECK A late fee of $25 applies after the due date.\n      -&gt; details not in source: $25\n      -&gt; low word support (0.5)\nok    You can call the billing office at extension 4410 on weekdays.\n\n3 of 5 sentences need a human check\n<\/code><\/pre>\n<h2>What to notice<\/h2>\n<ul>\n<li>Three of five sentences contain details the policy never states: 45 days (the policy says 30), 12 months (it says 6) and a $25 late fee (it mentions none).<\/li>\n<li>The wrong sentences read just as confidently as the right ones.<\/li>\n<li>\"Weekdays\" passed even though the policy says \"Monday to Friday\". It means the same thing, so this is correct, but the check passed it because the numbers and most words matched, not because it understood the meaning.<\/li>\n<li>In the \"beat the checker\" task, a false sentence with new words is usually caught: \"A deposit is required before a payment plan starts\" scores 0.2 word support. A false sentence built from the policy's own words passes: \"Payment plans are only available to patients who pay by card\" has no new numbers and scores 0.75. Number checks catch one kind of error; meaning-level checks and human review are still needed.<\/li>\n<\/ul>\n<h2>Troubleshooting<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>details() returns numbers without the $ sign<\/td>\n<td>Use the pattern r\"\\$?\\d+\" exactly, including the backslash before the $.<\/td>\n<\/tr>\n<tr>\n<td>Every sentence shows low word support<\/td>\n<td>Lower-case the sentence before splitting it into words.<\/td>\n<\/tr>\n<tr>\n<td>TypeError: unsupported operand type(s) for -<\/td>\n<td>details() must return a set, not a list.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Self-check<\/h2>\n<ul>\n<li>My checker flags the same 3 sentences as the expected output.<\/li>\n<li>I wrote one false sentence the checker missed, and I can say why it missed it.<\/li>\n<li>I ran the check on a policy and answer from my own field.<\/li>\n<\/ul>", "C3-M01-L04-lesson": "<h2>Lesson objectives<\/h2>\n<ol>\n<li>Explain the difference between a hosted model accessed through an API and an open-weight model you run yourself.<\/li>\n<li>Compare models on quality, cost, speed, context size and data control for a specific task.<\/li>\n<li>Use a weighted decision matrix with must-have rules to recommend a model, and record when the facts were checked.<\/li>\n<\/ol>\n<h2>1. Hook<\/h2>\n<p>Two teams in the same company ask IT for \"the best AI model\". Marketing wants to draft 200 social posts a week, fast and cheap. The clinic partner team wants to summarize letters that contain patient information, and their compliance lead says the data must stay under the organization's control.<\/p>\n<p><strong>Think about it:<\/strong> should both teams get the same model? Why not?<\/p>\n<h2>2. Explain<\/h2>\n<h3>Two ways to get a model<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Hosted model through an API<\/th>\n<th>Open-weight model<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What it is<\/td>\n<td>The provider runs the model; you send requests over the internet and pay per token.<\/td>\n<td>The trained weights are published, so you can download and run the model on servers or a cloud account you control.<\/td>\n<\/tr>\n<tr>\n<td>Examples<\/td>\n<td>Google Gemini, OpenAI and Anthropic models.<\/td>\n<td>Google's Gemma family, Meta's Llama family, Mistral models.<\/td>\n<\/tr>\n<tr>\n<td>Strengths<\/td>\n<td>Strongest models available, no servers to manage, quick to start.<\/td>\n<td>More control over where data goes, can be customized, no per-token fees to a provider.<\/td>\n<\/tr>\n<tr>\n<td>Costs and limits<\/td>\n<td>Data leaves your systems under the provider's terms; prices and models change.<\/td>\n<td>You pay for hardware and staff to run it; usually less capable than top hosted models; license terms vary.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>\"Open-weight\" is more precise than \"open source\": many of these models publish their weights but not their training data, and their licenses can include usage restrictions. Read the license before using one in a product.<\/p>\n<h3>Sizes within a family<\/h3>\n<p>Providers usually offer a family of sizes. On Google's Gemini model page, the list includes Gemini 4 Argon as the flagship reasoning model, plus Flash and Flash-Lite models built for speed and lower cost. Bigger models usually give better answers on hard tasks; smaller ones are faster and cheaper and are often good enough for simple ones. Model names and line-ups change often, so check the official page before you decide.<\/p>\n<h3>Five criteria<\/h3>\n<ul>\n<li><strong>Quality on your task.<\/strong> Public leaderboards are a starting point, not an answer. Test candidates on 10 to 20 real examples from your work (Module 3).<\/li>\n<li><strong>Cost.<\/strong> Price per million input and output tokens, times your volume (Lesson 2).<\/li>\n<li><strong>Speed.<\/strong> How long users wait, which matters most in live chat.<\/li>\n<li><strong>Context size.<\/strong> Whether your typical input fits (Lesson 2).<\/li>\n<li><strong>Data control.<\/strong> Where data is processed and stored, whether the provider may use it, and what your organization's rules and contracts require.<\/li>\n<\/ul>\n<h3>Weights and must-haves<\/h3>\n<p>A weight says how much a criterion matters. A must-have removes an option no matter how well it scores elsewhere. \"Patient data must stay in systems we control\" is a must-have, not a weight. Decide must-haves first, then score what is left.<\/p>\n<h3>Key terms in plain language<\/h3>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Model provider<\/strong><\/td>\n<td>The company that builds and runs a model, such as Google, OpenAI or Anthropic.<\/td>\n<\/tr>\n<tr>\n<td><strong>API<\/strong><\/td>\n<td>Short for application programming interface: a way for your own code to send a request to a model over the internet and get the answer back.<\/td>\n<\/tr>\n<tr>\n<td><strong>Proprietary (hosted) model<\/strong><\/td>\n<td>A model you use through the provider's service and pay for by use. You cannot download it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Open-weight model<\/strong><\/td>\n<td>A model whose trained settings (its \"weights\") are published, so you can download it and run it on your own computer or server.<\/td>\n<\/tr>\n<tr>\n<td><strong>Latency<\/strong><\/td>\n<td>How long you wait for an answer. Smaller models usually reply faster.<\/td>\n<\/tr>\n<tr>\n<td><strong>Model family<\/strong><\/td>\n<td>A set of related models from one provider in different sizes, from large and capable to small, fast and cheap.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. Demonstrate<\/h2>\n<ol>\n<li>Open the Gemini models page (<a href=\"https://ai.google.dev/gemini-api/docs/models\" target=\"_blank\" rel=\"noopener\">https://ai.google.dev/gemini-api/docs/models<\/a>) and see how each model's description, context size and status (stable or preview) are listed.<\/li>\n<li>Open the pricing page and compare a Flash-Lite model with the flagship for the support-ticket task from Lesson 2.<\/li>\n<li>Open Google's Gemma page (<a href=\"https://ai.google.dev/gemma\" target=\"_blank\" rel=\"noopener\">https://ai.google.dev/gemma<\/a>) to see what an open-weight model family offers, and where its terms of use are linked.<\/li>\n<\/ol>\n<h2>4. Practice<\/h2>\n<p>Complete the lab <strong>Choose the right model for the job<\/strong>.<\/p>\n<h2>5. Check<\/h2>\n<p>Take the lesson quiz.<\/p>\n<h2>6. Apply<\/h2>\n<p>Choose one project from your field, set weights for the five criteria, write any must-haves, and score two or three real models using official model and pricing pages. Record the date you checked. Write a three-sentence recommendation: which model, why, and what you would test before committing.<\/p>\n<p><strong>Module 1 wrap-up:<\/strong> note one change in how you will use AI at work after this module.<\/p>", "C3-M01-L04-lab": "<h2>Purpose<\/h2>\n<p>Score three kinds of model with a weighted decision matrix, then see how the winner changes when a project's priorities change and when a must-have rule removes options.<\/p>\n<h2>Files<\/h2>\n<ul>\n<li><strong>Starter notebook<\/strong>: <code>labs/C03-M01-L04-Choosing a model Lab Starter-v1.ipynb<\/code><\/li>\n<li><strong>Solution notebook<\/strong>: <code>labs/C03-M01-L04-Choosing a model Lab Solution-v1.ipynb<\/code><\/li>\n<\/ul>\n<h2>Requirements<\/h2>\n<ul>\n<li>Google Colab or Python 3.12 or later.<\/li>\n<li>Libraries: Python standard library only.<\/li>\n<li>Time: 20 minutes, plus 10 minutes for the Apply step.<\/li>\n<\/ul>\n<h2>Setup steps<\/h2>\n<ol>\n<li>Upload the starter notebook to Colab (<strong>File &gt; Upload notebook<\/strong>) or open it in Jupyter.<\/li>\n<li>Complete the TODO cells: <code>weighted_score()<\/code> and the <code>allowed<\/code> line in <code>rank()<\/code>.<\/li>\n<li>Choose <strong>Runtime &gt; Run all<\/strong>.<\/li>\n<li>For the Apply step, use official model and pricing pages only, and record the date you checked them.<\/li>\n<\/ol>\n<h2>Expected output<\/h2>\n<p>Output of the solution notebook, run on Python 3.13.<\/p>\n<pre><code>Options: Large hosted model, Small hosted model, Open-weight model, self-hosted\n3.85\n\nMarketing team: draft social posts\n  3.85  Small hosted model\n  3.70  Large hosted model\n  3.40  Open-weight model, self-hosted\n\nClinic: summarize patient letters\n  3.90  Open-weight model, self-hosted\n  3.60  Large hosted model  (removed: fails a must-have)\n  3.50  Small hosted model  (removed: fails a must-have)\n<\/code><\/pre>\n<h2>What to notice<\/h2>\n<ul>\n<li>The same three options rank differently for two projects, because the weights differ.<\/li>\n<li>For the clinic, the must-have on data control removes both hosted options before their scores matter.<\/li>\n<li>The scores in the lab are illustrative. In real decisions, quality scores should come from testing the model on your own task (Module 3).<\/li>\n<li>A hosted model does not automatically fail a data-control requirement. Some providers offer data-processing terms, regional hosting or enterprise agreements. Check the actual terms with your organization rather than assume.<\/li>\n<\/ul>\n<h2>Troubleshooting<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AssertionError: Weights ... must add to 100<\/td>\n<td>Your profile's weights do not add to 100. Adjust them.<\/td>\n<\/tr>\n<tr>\n<td>KeyError when you add your own option<\/td>\n<td>Every option needs all five criteria: quality, cost, speed, data_control, context.<\/td>\n<\/tr>\n<tr>\n<td>No option is removed for the clinic<\/td>\n<td>The allowed line still sets True for everything. Use all() over the rules.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Self-check<\/h2>\n<ul>\n<li>My ranking matches the expected output.<\/li>\n<li>I can explain the difference between a weight and a must-have.<\/li>\n<li>I scored two or three real models for one project in my field, with the date I checked them.<\/li>\n<\/ul>"};

function submitQuiz(id){const s=QS[id];s.sub=true;const sc=QUIZ[id].filter((q,k)=>s.a[k]==q[2]).length;const p=lp(id);p.best=Math.max(p.best??0,sc);save();render()}
const today=()=>new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
function record(kind,title,detail,foot){return `<div class="record"><span class="ring">BJS</span><span class="eyebrow">BJS Academy · ${kind}</span><h2>${esc(title)}</h2><p>This records that</p><input aria-label="Your name" placeholder="Type your name" value="${esc(P.name||"")}" oninput="P.name=this.value;save()"><p style="margin-top:18px">${detail}</p><p style="margin-top:28px;font-weight:700;color:var(--deep)">Dr. Janet Bih Shufor<br><span class="tagline">Learn AI. Shape tomorrow.</span></p><p style="font-size:13px;color:#7a6f92">${today()}. ${foot}</p><button class="btn noprint" onclick="print()">Print or save as PDF</button></div>`}
V.record=(cid,mnum)=>{const c=cById(cid);if(!c)return V.progress();
 if(mnum=="course"){return V.progress();if(cDone(c)<allL(c).length)return V.progress();return `<div class="wrap" style="padding:40px 24px 88px">${record("Certificate of Completion",c.name+" complete",`completed <b>${esc(c.name)}</b> (${esc(c.short)}),<br>including ${c.modules.length} modules, ${allL(c).length} lessons with Python labs, and every quiz.`,"Certificate of Completion issued by BJS Academy. It is not an accredited qualification or an official exam result.")}<p class="noprint"><a href="#/progress">← Back to my progress</a></p></div>`}
 const m=c.modules.find(x=>x.num==+mnum);if(!m||!modDone(m))return V.progress();
 return `<div class="wrap" style="padding:40px 24px 88px">${record("Module record",`Module ${m.num} complete`,`completed <b>${esc(c.name)}, Module ${m.num}: ${esc(m.title)}</b>,<br>including ${m.lessons.length} lessons, ${m.lessons.length} Python labs and ${m.lessons.length} quizzes.`,"This is a progress record for one module, not the course Certificate of Completion.")}<p class="noprint"><a href="#/progress">← Back to my progress</a></p></div>`};
V.progress=()=>`<div class="wrap page-head"><span class="eyebrow">All courses</span><h1>My progress</h1><p>This is the free preview: Module 1 of Python Liftoff and Module 1 of Prompt to Agent. Progress is saved in this browser on this device only. Clearing browser data resets it. A lesson is complete when you have read it, matched the lab output and passed its quiz.</p></div>
 <div class="wrap" style="padding-bottom:88px">${COURSES.filter(c=>allL(c).length).map(c=>{const n=allL(c).length,d=cDone(c);return `<section class="prog-course"><h2>${esc(c.short)}: ${esc(c.name)}</h2>${bar(d,n,"Free lessons")}
 ${d==n?`<p style="margin:18px 0">You finished the free module. ${enrollBtn("Continue with the full course","sm")}</p>`:""}
 <div class="tablewrap" style="margin-top:18px"><table class="ptable"><tr><th>Module</th><th>Lessons complete</th><th>Quiz scores</th><th>Record</th></tr>
 ${c.modules.filter(m=>m.free).map(m=>{const dd=m.lessons.filter(l=>lessonDone(l.id)).length;return `<tr><td><a href="#/${c.id}/${m.lessons[0].id}/lesson">M${pad(m.num)} ${esc(m.title)}</a></td><td>${dd} of ${m.lessons.length}</td><td>${m.lessons.map(l=>{const b=(P[l.id]||{}).best;return b!=null?b+"/"+QUIZ[l.id].length:"–"}).join(" · ")}</td><td>${modDone(m)?`<a class="pill done" href="#/record/${c.id}/${m.num}">Print record</a>`:'<span class="pill">In progress</span>'}</td></tr>`}).join("")}</table></div></section>`}).join("")}
 <p class="noprint">Your name for records: <input aria-label="Your name" placeholder="Type your name" value="${esc(P.name||"")}" oninput="P.name=this.value;save()" style="padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);font:inherit"></p>
 <p style="margin-top:24px" class="noprint"><button class="btn ghost sm" onclick="if(confirm('Reset all progress in this browser?')){P={};QS={};save();render()}">Reset my progress</button></p></div>`;
V.locked=(c,m,L)=>`<div class="wrap page-head"><div class="crumbs"><a href="#/course/${c.id}">${esc(c.name)}</a> / Module ${m.num}</div><span class="eyebrow">🔒 Full course</span><h1 style="font-size:clamp(28px,4vw,44px)">${esc(L.title)}</h1><p>This lesson is part of ${esc(c.name)}, Module ${m.num}: ${esc(m.title)}. The full course includes every lesson, Python lab, quiz, module record and the Certificate of Completion.</p><div class="ctas">${enrollBtn("Get the full course")}<a class="btn ghost" href="#/free">Try the free lessons</a></div></div><div style="height:88px"></div>`;
V.free=()=>`<div class="wrap page-head"><span class="eyebrow">Free preview</span><h1>Start learning, <em class="accent">free</em></h1><p>Two complete modules, free: lessons, Python labs with starter and solution notebooks, and quizzes. No sign-up needed.</p></div>
 <div class="wrap" style="padding-bottom:88px"><div class="grid g3" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${COURSES.flatMap(c=>c.modules.filter(m=>m.free).map(m=>`<a class="card" style="text-decoration:none" href="#/${c.id}/${m.lessons[0].id}/lesson"><span class="num">${esc(c.short)} · Module ${m.num}</span><h3>${esc(m.title)}</h3><p>From ${esc(c.name)}. ${m.lessons.length} lessons: ${m.lessons.map(l=>esc(l.title)).join("; ")}.</p><span class="btn sm">Start →</span></a>`)).join("")}</div>
 <div class="doc" style="margin-top:36px"><h2>Ready for more?</h2><p>The full BJS Academy pathway has three courses, 29 modules and 99 lessons: Python Liftoff, Data Storytellers and Prompt to Agent.</p>${enrollBtn("See full course options")}</div></div>`;
V.enroll=()=>`<div class="wrap page-head"><span class="eyebrow">Full courses</span><h1>Get the <em class="accent">full pathway</em></h1><p>Every course includes all lessons, downloadable Python labs with solutions, quizzes, printable module records and a BJS Academy Certificate of Completion (not an accredited qualification).</p></div>
 <div class="wrap" style="padding-bottom:88px"><div class="cgrid">${COURSES.map(c=>`<div class="card"><span class="num">${esc(c.short)}</span><h3>${esc(c.name)}</h3><p>${esc(c.blurb)}</p><p style="font-size:14px;margin:0">${c.modules.length} modules · ${totalL(c)} lessons</p></div>`).join("")}</div>
 <div class="doc" style="margin-top:36px"><h2>How to enroll</h2>${ENROLL_URL?`<p>Enrollment is through our learning platform, where you can choose a single course or the full three-course pathway.</p>${enrollBtn("Enroll now")}`:`<p>Enrollment for the full courses opens soon on our learning platform. Meanwhile, start with the <a href="#/free">free lessons</a>.</p>`}<p class="note">Python Liftoff prepares learners for the Python Institute's PCEP and PCAP exams. BJS Academy is not affiliated with the Python Institute; learners book and pay for exams themselves.</p></div></div>`;
function render(){const h=location.hash.replace(/^#\/?/,"").split("/");let html,r="home";
 if(!h[0])html=V.home();
 else if(h[0]=="courses"){html=V.courses();r="courses"}
 else if(h[0]=="path"){html=V.path();r="path"}
 else if(h[0]=="free"){html=V.free();r="free"}
 else if(h[0]=="enroll"){html=V.enroll();r="enroll"}
 else if(h[0]=="course"){html=V.course(h[1]);r="courses"}
 else if(cById(h[0])){html=h[1]?V.lesson(h[0],h[1],h[2]):V.course(h[0]);r="courses"}
 else if(h[0]=="record"){html=V.record(h[1],h[2]);r="progress"}
 else if(h[0]=="progress"){html=V.progress();r="progress"}else html=V.home();
 $("#app").innerHTML=html;document.querySelectorAll(".nav ul a").forEach(a=>a.classList.toggle("on",a.dataset.r==r));$("#nl").classList.remove("open")}
let lastHash="";window.addEventListener("hashchange",()=>{render();const k=location.hash.split("/").slice(0,3).join("/");if(k!=lastHash)scrollTo(0,0);lastHash=k});
render();lastHash=location.hash.split("/").slice(0,3).join("/");
</script>
</body>
</html>
