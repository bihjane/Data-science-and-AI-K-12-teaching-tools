:root{--mist:#F3EEFE;--lav:#CDB8FA;--orchid:#9B6BF2;--royal:#6B2FD0;--deep:#2A0F57;--night:#07000E;--body:#3E3352;--white:#fff;--line:#E2D7FB;--ok:#1F7A4D;--okbg:#E5F5EC;--bad:#A3263B;--badbg:#FBE8EC}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--mist);color:var(--body);font-family:Montserrat,system-ui,sans-serif;font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--royal)}a:hover{color:var(--deep)}
h1,h2,h3,h4{color:var(--deep);line-height:1.15;letter-spacing:-.015em;margin:0 0 .5em}
h1{font-weight:800}h2{font-weight:800}h3{font-weight:700}
em.accent,i.accent{font-style:italic;font-weight:600;color:var(--royal)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
/* nav */
header.nav{position:sticky;top:0;z-index:20;background:rgba(243,238,254,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;height:68px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--deep);font-weight:800;font-size:19px;letter-spacing:-.01em}
.ring{width:40px;height:40px;border-radius:50%;border:3.5px solid var(--royal);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:var(--deep);flex:none}
.nav ul{display:flex;gap:4px;list-style:none;margin:0 0 0 auto;padding:0}
.nav ul a{display:block;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--deep);font-weight:600;font-size:14px}
.nav ul a:hover,.nav ul a.on{background:var(--white)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;border:0;background:var(--royal);color:#fff;font-weight:700;font-size:15px;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--deep);color:#fff}
.btn.ghost{background:var(--white);color:var(--deep);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--orchid)}
.btn.sm{padding:8px 16px;font-size:14px}
.menu{display:none;margin-left:auto;background:none;border:0;font-size:26px;color:var(--deep)}
/* hero */
.hero{position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:end;min-height:560px;padding-top:40px}
.hero-txt{padding-bottom:72px}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--royal);margin-bottom:18px}
.hero h1{font-size:clamp(40px,6vw,72px);margin-bottom:20px}
.hero p.lead{font-size:20px;max-width:520px;margin:0 0 28px}
.tagline{font-style:italic;font-weight:600;color:var(--royal)}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .facts{margin-top:28px;font-size:14px;color:#6b5f84;display:flex;flex-wrap:wrap;gap:6px 18px}
.hero-img{align-self:end}
.hero-img img{display:block;width:100%;max-width:520px;margin-left:auto}
.glow{position:absolute;inset:auto -10% -40% 30%;height:80%;background:radial-gradient(closest-side,rgba(155,107,242,.22),transparent);pointer-events:none}
/* sections */
section.band{padding:88px 0}
section.band.white{background:var(--white)}
.sec-head{max-width:640px;margin-bottom:40px}
.sec-head h2{font-size:clamp(30px,4vw,42px)}
.sec-head p{font-size:18px;margin:0}
.grid{display:grid;gap:22px}
.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--white);border-radius:20px;padding:28px;box-shadow:0 1px 0 var(--line),0 12px 32px -18px rgba(42,15,87,.25)}
.band.white .card{background:var(--mist);box-shadow:none}
.card h3{font-size:20px}
.card p{margin:0}
.num{font-weight:800;font-size:15px;color:var(--orchid);margin-bottom:10px;display:block}
/* course cards */
.ccard{display:flex;flex-direction:column;background:var(--white);border-radius:24px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 0 var(--line),0 18px 40px -22px rgba(42,15,87,.35);transition:transform .15s}
.ccard:hover{transform:translateY(-3px);color:inherit}
.cover{position:relative;aspect-ratio:16/9;background:var(--mist);display:flex;overflow:hidden}
.cover .cl{flex:1;padding:6% 0 5% 7%;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.cover .ck{display:flex;align-items:center;gap:10px;font-size:clamp(9px,1.1vw,12px);letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--royal)}
.cover .ck .ring{width:34px;height:34px;font-size:9px;border-width:3px}
.cover h3{font-size:clamp(20px,2.6vw,32px);font-weight:800;margin:0;line-height:1.05}
.cover .by{font-size:clamp(10px,1.1vw,13px);font-weight:700;color:var(--deep)}
.cover .by span{display:block;font-style:italic;font-weight:600;color:var(--royal)}
.cover img{width:44%;align-self:flex-end;display:block}
.ccard .cb{padding:24px 26px 28px}
.ccard .cb p{margin:0 0 14px}
.pill{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--mist);color:var(--royal);margin-right:6px}
.pill.soon{background:#FFF3D6;color:#7A5200}
.pill.done{background:var(--okbg);color:var(--ok)}
/* about */
.about{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:center}
.about img{width:100%;border-radius:24px;display:block;background:var(--lav)}
/* faq */
details.faq{background:var(--white);border-radius:16px;padding:18px 22px;margin-bottom:12px}
details.faq summary{font-weight:700;color:var(--deep);cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font-weight:800;color:var(--royal)}
details.faq[open] summary::after{content:"−"}
details.faq p{margin:12px 0 0}
/* footer */
footer{background:var(--night);color:#CFC4EA;padding:56px 0 40px;font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
footer .brand{color:#fff}footer .ring{color:#fff;border-color:var(--orchid)}
footer a{color:#E2D7FB}
/* course page */
.page-head{padding-top:56px;padding-bottom:36px}
.crumbs{font-size:14px;margin-bottom:16px}
.crumbs a{text-decoration:none}
.page-head h1{font-size:clamp(32px,4.6vw,52px)}
.page-head p{font-size:18px;max-width:720px}
.meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.mod{background:var(--white);border-radius:18px;margin-bottom:12px;overflow:hidden}
.mod summary{display:flex;align-items:center;gap:16px;padding:20px 24px;cursor:pointer;list-style:none}
.mod summary .mn{font-weight:800;color:var(--orchid);width:44px;flex:none}
.mod summary .mt{font-weight:700;color:var(--deep);flex:1}
.mod .lessons{padding:0 24px 18px 84px}
.mod .lessons li{padding:6px 0}
.lesson-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.lesson-row a{font-weight:600}
.locked{color:#8a7fa3}
/* lesson page */
.lesson-layout{display:grid;grid-template-columns:260px 1fr;gap:36px;padding-bottom:80px}
.side{position:sticky;top:88px;align-self:start;background:var(--white);border-radius:18px;padding:18px}
.side h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--royal);margin:6px 8px 10px}
.side a{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;text-decoration:none;color:var(--deep);font-size:14px;font-weight:600;line-height:1.35}
.side a:hover,.side a.on{background:var(--mist)}
.side .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--lav);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;margin-top:1px}
.side .dot.ok{background:var(--ok);border-color:var(--ok)}
.tabs{display:flex;gap:6px;background:var(--white);padding:6px;border-radius:999px;width:max-content;max-width:100%;margin-bottom:26px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 20px;border-radius:999px;font-weight:700;color:var(--deep);font-size:15px;white-space:nowrap}
.tabs button.on{background:var(--royal);color:#fff}
.doc{background:var(--white);border-radius:22px;padding:40px clamp(22px,4vw,48px)}
.doc h2{font-size:24px;margin-top:1.6em}
.doc h2:first-child{margin-top:0}
.doc h3{font-size:18px;margin-top:1.4em}
.doc table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14.5px;display:block;overflow-x:auto}
.doc th,.doc td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.doc th{background:var(--mist);color:var(--deep)}
.doc pre{background:var(--night);color:#E9E2FF;border-radius:14px;padding:18px 20px;overflow-x:auto;font-size:13.5px;line-height:1.5}
.doc code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.doc :not(pre)>code{background:var(--mist);padding:1px 6px;border-radius:6px;color:var(--deep)}
.doc li{margin:4px 0}
.doc-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
.dl{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 6px}
/* quiz */
.q{border:1.5px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:18px}
.q .qn{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orchid)}
.q p.qt{font-weight:600;color:var(--deep);margin:6px 0 14px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--mist);border:1.5px solid transparent;border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--body);font-size:15px;line-height:1.5}
.opt:hover{border-color:var(--lav)}
.opt b{color:var(--royal);flex:none}
.opt.sel{border-color:var(--royal);background:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--okbg);color:#16502f}.fb.no{background:var(--badbg);color:#6e1424}
.score{background:var(--deep);color:#fff;border-radius:18px;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.score h3{color:#fff;margin:0}
/* progress */
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--orchid),var(--royal));border-radius:999px}
.ptable{width:100%;border-collapse:collapse;background:var(--white);border-radius:18px;overflow:hidden}
.ptable td,.ptable th{padding:14px 18px;border-bottom:1px solid var(--line);text-align:left}
.ptable th{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--royal)}
.record{background:#fff;border-radius:24px;padding:56px;text-align:center;border:10px solid var(--mist);outline:2px solid var(--lav);margin-top:28px}
.record .ring{width:84px;height:84px;font-size:22px;border-width:6px;margin:0 auto 18px}
.record h2{font-size:34px}
.record input{outline:none;font:inherit;font-size:28px;font-weight:700;color:var(--deep);text-align:center;border:0;border-bottom:2px solid var(--lav);background:none;width:min(520px,100%);padding:6px}
.note{background:#FFF8E6;border-radius:14px;padding:14px 18px;font-size:14.5px;color:#5c4300}
@media print{header.nav,footer,.noprint{display:none!important}body{background:#fff}.record{border:0;outline:0;margin:0}}
@media (max-width:900px){
 .nav ul{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:var(--mist);padding:12px 16px;border-bottom:1px solid var(--line)}
 .nav ul.open{display:flex}.menu{display:block}.nav .btn{display:none}
 .hero .wrap{grid-template-columns:1fr;min-height:0}.hero-txt{padding-bottom:0}.hero-img img{margin:0 auto;max-width:380px}
 .g3,.g4,.g2{grid-template-columns:1fr}.about{grid-template-columns:1fr}.about img{max-width:280px}
 .lesson-layout{grid-template-columns:1fr}.side{position:static}
 .mod .lessons{padding-left:24px}.wrap{padding:0 16px}.record{padding:32px 18px}
}
.qt pre,.qcode{background:var(--night);color:#F3EEFE;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.5;overflow-x:auto;white-space:pre;margin:10px 0 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.mod .badge{margin-left:auto}.mod .sub{display:block;font-size:13px;font-weight:500;color:#6d6185;margin-top:2px}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:p}
.path .card{position:relative}.path .card:not(:last-child)::after{content:"→";position:absolute;right:-16px;top:40%;color:var(--royal);font-weight:800}
.exam-pill{background:var(--deep);color:#fff}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cgrid .cover{aspect-ratio:4/3}.cgrid .cover h3{font-size:clamp(19px,1.8vw,23px)}.cgrid .cover img{width:40%}.cgrid .cover .cl{padding:7% 0 6% 7%}
.prog-course{margin:0 0 44px}.prog-course h2{font-size:26px}
.ptable td:first-child{min-width:220px}
.tablewrap{overflow-x:auto}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.lesson-layout>*{min-width:0}.doc pre,.qt pre{max-width:100%;overflow-x:auto}.doc table{display:block;overflow-x:auto;max-width:100%}.doc code{overflow-wrap:anywhere}.doc td code{white-space:nowrap;overflow-wrap:normal}
@media (max-width:900px){.path,.cgrid{grid-template-columns:1fr}.path .card::after{display:none}}
@media print{header.nav,footer,.noprint,.prog-course,.page-head{display:none!important}.record{display:block!important;break-inside:avoid}}
</style>
</head>

ll", "exam": false}, {"id": "C3-M04-L03", "title": "Conversations, system instructions and streaming", "exam": false}, {"id": "C3-M04-L04", "title": "Errors, rate limits and cost tracking", "exam": false}]}, {"num": 5, "title": "Embeddings and semantic search", "note": "", "free": false, "lessons": [{"id": "C3-M05-L01", "title": "Meaning as numbers: embeddings", "exam": false}, {"id": "C3-M05-L02", "title": "Measuring similarity", "exam": false}, {"id": "C3-M05-L03", "title": "Semantic search over your documents", "exam": false}, {"id": "C3-M05-L04", "title": "Storing vectors in a vector database (Chroma)", "exam": false}]}, {"num": 6, "title": "Building a RAG pipeline", "note": "", "free": false, "lessons": [{"id": "C3-M06-L01", "title": "Why RAG: grounding answers in your documents", "exam": false}, {"id": "C3-M06-L02", "title": "Loading and chunking documents", "exam": false}, {"id": "C3-M06-L03", "title": "Retrieve, then generate", "exam": false}, {"id": "C3-M06-L04", "title": "Citations and saying \"I don't know\"", "exam": false}]}, {"num": 7, "title": "Evaluating and improving RAG", "note": "", "free": false, "lessons": [{"id": "C3-M07-L01", "title": "How RAG fails: a diagnosis checklist", "exam": false}, {"id": "C3-M07-L02", "title": "Measuring retrieval quality", "exam": false}, {"id": "C3-M07-L03", "title": "Judging answers with rubrics and model graders", "exam": false}, {"id": "C3-M07-L04", "title": "Improving results: chunking, metadata, reranking, query rewriting", "exam": false}]}, {"num": 8, "title": "Tool use and function calling", "note": "", "free": false, "lessons": [{"id": "C3-M08-L01", "title": "From chatbot to assistant that acts", "exam": false}, {"id": "C3-M08-L02", "title": "Describing tools with schemas", "exam": false}, {"id": "C3-M08-L03", "title": "The tool-calling loop in plain Python", "exam": false}, {"id": "C3-M08-L04", "title": "Guardrails: validation, permissions, human approval", "exam": false}]}, {"num": 9, "title": "Agentic AI foundations", "note": "", "free": false, "lessons": [{"id": "C3-M09-L01", "title": "What makes a system agentic: goals, loops, levels of autonomy", "exam": false}, {"id": "C3-M09-L02", "title": "An agent loop from scratch", "exam": false}, {"id": "C3-M09-L03", "title": "Memory: short-term and long-term", "exam": false}, {"id": "C3-M09-L04", "title": "Planning, self-checking and knowing when to stop", "exam": false}]}, {"num": 10, "title": "Agent workflows with LangGraph", "note": "", "free": false, "lessons": [{"id": "C3-M10-L01", "title": "Why a framework: state, nodes and edges", "exam": false}, {"id": "C3-M10-L02", "title": "A workflow graph with branches", "exam": false}, {"id": "C3-M10-L03", "title": "Agentic RAG: the agent decides when to search", "exam": false}, {"id": "C3-M10-L04", "title": "Human-in-the-loop and multi-agent patterns", "exam": false}]}, {"num": 11, "title": "Responsible and secure AI", "note": "", "free": false, "lessons": [{"id": "C3-M11-L01", "title": "Privacy and sensitive data in prompts and documents", "exam": false}, {"id": "C3-M11-L02", "title": "Prompt injection and other security risks", "exam": false}, {"id": "C3-M11-L03", "title": "Bias, fairness and testing for harm", "exam": false}, {"id": "C3-M11-L04", "title": "Governance: documentation, monitoring and risk frameworks", "exam": false}]}, {"num": 12, "title": "Capstone: build, ship and present", "note": "", "free": false, "lessons": [{"id": "C3-M12-L01", "title": "Scoping your capstone, outcomes first", "exam": false}, {"id": "C3-M12-L02", "title": "A simple web interface with Streamlit", "exam": false}, {"id": "C3-M12-L03", "title": "Testing, documentation and a model card", "exam": false}, {"id": "C3-M12-L04", "title": "Demo day and peer review", "exam": false}]}], "name": "Prompt to Agent", "short": "Course 03", "level": "Intermediate", "titleHtml": "Prompt to Agent <i class=\"accent\">Generative AI, Agentic AI and RAG<\/i>", "blurb": "Go from how AI writes text to building assistants that search your documents and take careful actions.", "long": "A 12-module course for working professionals. You learn how language models work, call them from Python, ground answers in your own documents with retrieval (RAG), and build agents with guardrails and human review. You finish with a capstone project you can show.", "notice": "Labs run offline by default with built-in stand-ins, so you need no API key. To use a real model, set LIVE = True and add a free Google AI Studio key as a Colab secret named GEMINI_API_KEY. Model names and prices change often, so check the provider's current page before relying on them. If you have completed Courses 01 and 02, Module 2 is an optional refresher.", "pathText": "Generative AI, prompt design, embeddings, RAG, tools and agents, with responsible AI and a capstone.", "assumes": "Python (Course 01) and data skills (Course 02), or Module 2's refresher.", "outcomes": ["Explain how language models produce text, what they cost and where they fail.", "Write Python that calls AI models, tests prompts and tracks cost.", "Build and evaluate a document Q&A assistant that cites its sources.", "Design agents with tools, limits and human approval steps.", "Spot privacy, security and fairness risks and reduce them.", "Ship a capstone with a web interface, model card and demo."]}];const FAQ=[["Which course should I start with?", "Start with Course 01, Python Liftoff, if you have never programmed. If you already know basic Python, start Course 02. If you know Python and data analysis, go straight to Course 03; its Module 2 is an optional refresher."], ["Do I need coding experience?", "No. Course 01 starts from zero. Every lab comes with starter code, a full solution and the expected output."], ["What do I need to run the labs?", "A free Google account to use Google Colab, or Python 3.12 or later on your own computer. Each lab lists the library versions it was tested with."], ["Do I need a paid AI account?", "No. Course 03 labs run offline with built-in stand-ins. You can switch on a real model with a free Google AI Studio key if you want to."], ["What is free?", "Module 1 of Python Liftoff and Module 1 of Prompt to Agent are free: every lesson, Python lab and quiz in them. The other modules, and the Certificate of Completion, are part of the full courses."], ["Is my progress saved?", "Yes, in this browser on this device. If you clear your browser data or switch devices, your progress starts again."], ["Do I get a certificate?", "Each completed module gives you a printable module record, and each completed course gives you a BJS Academy Certificate of Completion. These are not accredited qualifications or official exam results."], ["Does Python Liftoff include the PCEP or PCAP exam?", "No. Python Liftoff prepares you for the Python Institute's PCEP and PCAP exams, with two practice exams. You book and pay for the real exams yourself with the exam provider. BJS Academy is not affiliated with the Python Institute."], ["Are the AI prices and model names current?", "AI prices and model line-ups change often, so each lesson shows you where to check the current figures."]];const QUIZ={"C1-M01-L01": [["What does the Python interpreter do?", ["Converts Python into a Word document.", "Reads, checks and runs Python code, translating it into bytecode as it goes.", "Only checks spelling.", "Compiles to machine code before you write it."], 1, "Python is interpreted: the interpreter checks syntax, translates to bytecode and runs the code."], ["What happens when you run this?\n\nx = 5\n  print(x)", ["5", "IndentationError", "NameError", "Nothing"], 1, "The second line is indented with no block to belong to, so Python raises IndentationError before running anything."], ["Which of these is a valid variable name?", ["2total", "for", "total_2", "my-total"], 2, "Names can contain letters, digits and underscores, cannot start with a digit, and cannot be keywords."], ["What does this print?\n\nScore = 10\nscore = 20\nprint(Score)", ["20", "10", "30", "NameError"], 1, "Names are case sensitive, so Score and score are different variables."], ["Which symbol starts a comment in Python?", ["//", "#", "--", "/*"], 1, "Everything after # on a line is ignored by Python."], ["A coding assistant gives you a 40-line script to clean a spreadsheet of customer data. What should you do before running it?", ["Run it straight away; AI code is tested.", "Read every line to understand what it changes, and test it on a copy with made-up data first.", "Run it twice to be sure.", "Delete the comments."], 1, "You are responsible for code you run. Read it, and test on copies, especially when real data is involved."]], "C1-M01-L02": [["What does this print?\n\nprint(0x1F)", ["0x1F", "31", "15", "1F"], 1, "0x marks a hexadecimal literal: 1×16 + 15 = 31."], ["What does this print?\n\nprint(int(-3.9))", ["-4", "-3", "-3.9", "ValueError"], 1, "int() truncates toward zero, so -3.9 becomes -3."], ["What does this print?\n\nprint(type(1e3))", ["<class 'int'>", "<class 'float'>", "<class 'str'>", "1000"], 1, "Scientific notation always makes a float."], ["What does this print?\n\nprint('35' + '1')", ["36", "351", "TypeError", "35 1"], 1, "Both are strings, so + joins them."], ["What does this print?\n\nprint(bool('False'))", ["False", "True", "None", "ValueError"], 1, "Any non-empty string is True, even the text 'False'."], ["Your script reads ages from a form and some cannot be converted to numbers. What is the most responsible handling?", ["Replace them with 0.", "Set them aside as missing and flag them for a person to check, rather than guessing.", "Delete those records.", "Use a random age."], 1, "Guessed values silently corrupt data. Flag them for review."]], "C1-M01-L03": [["What does this print?\n\nprint(-7 // 2)", ["-3", "-4", "-3.5", "3"], 1, "Floor division rounds down toward negative infinity: -3.5 becomes -4."], ["What does this print?\n\nprint(2 ** 3 ** 2)", ["64", "512", "36", "18"], 1, "** is right-associative: 3 ** 2 = 9 first, then 2 ** 9 = 512."], ["What does this print?\n\nprint(10 % 3 * 2 + 1)", ["3", "7", "5", "9"], 0, "% and * share precedence and go left to right: 10 % 3 = 1, 1 * 2 = 2, then + 1 = 3."], ["What does this print?\n\nprint(1, 2, 3, sep='-', end='.')", ["1 2 3", "1-2-3.", "1-2-3", "123."], 1, "sep joins the values with '-' and end replaces the new line with '.'."], ["x = input('Number: ') and the user types 5. What is type(x)?", ["int", "float", "str", "bool"], 2, "input() always returns a string. Convert with int() or float()."], ["Your script calculates refunds owed to 300 customers. What is the most responsible step before payments go out?", ["Trust the formula.", "Check the formula against several hand-worked examples and have a second person review the totals.", "Round everything up.", "Send them and fix errors later."], 1, "Money calculations that affect people need independent checks before use."]], "C3-M01-L01": [["An HR coordinator asks an AI tool to summarize the same policy three times and gets three slightly different summaries. What is the most likely explanation?", ["The tool is broken and should be reported.", "The model samples each next token with some randomness, so wording varies between runs.", "The policy document changed between runs.", "The model searched the internet each time and found different sources."], 1, "Most AI tools sample the next token with some randomness, so wording changes between runs. Nothing is broken, the document did not change, and a plain chat model does not search unless a search tool is added."], ["Which description of how a large language model writes an answer is most accurate?", ["It finds the matching answer in a database of stored answers.", "It copies the closest paragraph from its training data.", "It predicts one token at a time, based on patterns learned from training text.", "It runs a search engine query and summarizes the top result."], 2, "A language model generates text by repeatedly predicting the next token. It does not look up stored answers, normally copy training text, or search the web unless the system gives it that tool."], ["A bank already uses a model that gives each card transaction a fraud-risk score from 0 to 100. What kind of AI is this?", ["Generative AI, because it produces a number.", "Predictive AI, because it outputs a score or label.", "A large language model.", "Agentic AI, because it acts on its own."], 1, "A model that outputs a score or label is predictive AI. Generative AI produces new content such as text or images. Producing a number does not make it generative."], ["Which of these tasks is the poorest fit for a general AI chat tool without extra design?", ["Rewriting a parent newsletter at a simpler reading level.", "Brainstorming ten names for a product launch.", "Stating the exact refund limit in your company's current policy, which you have not given it.", "Summarizing a meeting transcript you paste in."], 2, "The model was not given the refund limit, so it may invent a plausible number. The other tasks work on text you provide or call for creativity."], ["A marketing manager lowers the temperature setting to get more consistent subject lines. What should she expect?", ["Identical output every time, guaranteed.", "More predictable output, though runs may still differ.", "More creative and varied output.", "More accurate facts about her company."], 1, "Lower temperature makes outputs more predictable but does not guarantee identical results. Higher temperature gives more variety. Temperature does not add facts the model was not given."], ["A school's admissions office wants AI to decide which applicants are accepted, with no person reviewing the decisions. What is the best response?", ["Go ahead: AI decisions are more objective than human ones.", "Go ahead, but only for applicants with complete files.", "Use AI to help summarize or organize files if allowed, but keep the decision with an accountable person and check for bias.", "Use a higher temperature so decisions are less repetitive."], 2, "Final decisions about people need an accountable person, and AI-assisted steps should be checked for bias. AI is not automatically objective, and file completeness does not remove those risks."]], "C3-M01-L02": [["Using the rule of thumb of about 4 characters per token, roughly how many tokens is a 2,000-character English email?", ["about 50", "about 500", "about 2,000", "about 8,000"], 1, "2,000 characters divided by 4 is about 500 tokens. This is an estimate; exact counts depend on the model's tokenizer."], ["Which of these count toward a model's context window in one request?", ["Only the question you type.", "Only the documents you attach.", "Your instructions, any documents, the conversation history and, for many models, the answer.", "Only the answer the model writes."], 2, "Everything the model sees in the request counts toward the window, and for many models the answer it writes counts too."], ["A task uses 1,000 input tokens and 1,000 output tokens per request. The model charges $0.30 per million input tokens and $2.50 per million output tokens. Which part costs more?", ["Input, because it comes first.", "Output, because it is priced higher per token.", "They cost the same, because the token counts are equal.", "Neither; only requests are charged, not tokens."], 1, "Input cost is 1,000 / 1,000,000 x $0.30 = $0.0003. Output cost is 1,000 / 1,000,000 x $2.50 = $0.0025, more than eight times higher."], ["A finance team runs 10,000 requests a month. Each uses 200 input tokens and 50 output tokens. At $0.30 per million input tokens and $2.50 per million output tokens, what is the monthly cost?", ["About $0.06", "About $1.85", "About $18.50", "About $1,850"], 1, "Input: 2,000,000 tokens x $0.30 per million = $0.60. Output: 500,000 tokens x $2.50 per million = $1.25. Total $1.85."], ["A 300-page employee handbook is about 225,000 tokens. Which statement is correct?", ["It fits in a 128,000-token window.", "It fits in a 1,000,000-token window, but the model may still miss details in the middle of such a long input.", "No model can read it.", "It fits anywhere, because tokens do not apply to PDF files."], 1, "225,000 tokens is more than 128,000 and less than 1,000,000. Research has found that models can miss details placed in the middle of long inputs, so fitting is not the same as reading it well."], ["A colleague wants to paste a spreadsheet of customer names, account numbers and balances into a free AI tool to count its tokens. What should you advise first?", ["Go ahead; counting tokens does not use the data.", "Check whether the data is personal or confidential and whether your organization allows that tool, and use a non-sensitive sample instead.", "Convert it to PDF first to reduce tokens.", "Split it into smaller pieces so each fits the window."], 1, "Pasting text into a tool sends the data to that tool, even just to count tokens. Check data rules first and use a non-sensitive sample."]], "C3-M01-L03": [["Why can a language model produce a realistic-looking citation to a court case that does not exist?", ["It copied the citation from a fake website.", "It generates text that fits the pattern of a citation, without checking that the case exists.", "It was instructed to deceive the user.", "Its database of cases was out of date."], 1, "The model produces likely-looking text. A citation has a familiar pattern, so it can generate one with no real case behind it, as happened in Mata v. Avianca (2023)."], ["An AI-drafted letter to a clinic patient about their bill reads smoothly and confidently. What should you check first before it is sent?", ["The tone and friendliness of the letter.", "The amounts, dates, deadlines and any policy details.", "The length of the letter.", "Whether it uses the clinic's logo."], 1, "Made-up content most often hides in specific, checkable details. Tone tells you nothing about accuracy."], ["Which instruction is most likely to reduce made-up answers to a policy question?", ["Be as detailed as possible.", "Answer confidently.", "Answer only from the policy below. If the policy does not say, reply: The policy does not say.", "Use your general knowledge of policies like this one."], 2, "Giving the source and allowing a 'does not say' answer removes the pressure to invent. The other instructions push the model to say more or fill gaps from general patterns."], ["A finance assistant was given the expense policy but applied the travel limit to a software purchase. What type of error is this?", ["Invented source", "Misreading the source", "Outdated training data", "Token limit exceeded"], 1, "The model had the right document but attached a rule to the wrong case. Misreading still happens even when the source is provided."], ["An automated checker flags numbers in an AI answer that do not appear in the source. Which made-up sentence could it miss?", ["Payment is due within 45 days.", "A late fee of $25 applies.", "Payment plans are only available to patients who pay by card.", "Plans can run for up to 12 months."], 2, "It contains no new numbers and reuses words from the policy, so number and word-overlap checks can pass it. The other options each contain numbers not in the source."], ["A marketing team uses AI for two jobs: brainstorming campaign slogans, and writing a press release that quotes sales figures. How should review differ?", ["Both need the same full fact check.", "Neither needs review if the model is good.", "Slogans need light review; the press release needs a person to verify every figure and claim before release.", "Only the slogans need review, because they are creative."], 2, "Match review to the stakes. A press release with figures goes to the public and can mislead; every figure needs a human check. Slogans are low-risk drafts."]], "C3-M01-L04": [["What is the main difference between a hosted model accessed through an API and an open-weight model?", ["Hosted models are always free; open-weight models are always paid.", "With a hosted model the provider runs it; with an open-weight model you can download the weights and run it on systems you control.", "Open-weight models cannot generate text.", "Hosted models do not use tokens."], 1, "The difference is who runs the model and controls the data. Free tiers exist for some hosted models but not all, and both kinds use tokens."], ["Why is 'open-weight' often more accurate than 'open source' for these models?", ["The weights are published, but training data may not be, and licenses can include restrictions.", "The models are heavier than other software.", "Open source means the model is hosted by a company.", "There is no difference between the two terms."], 0, "Many open-weight models publish weights but not training data or code, and their licenses may restrict some uses."], ["An IT help desk wants to classify 50,000 short tickets a day into five categories. Accuracy on test tickets is similar for a flagship model and a small, fast model. Which is the better starting choice?", ["The flagship model, because it is the best.", "The small, fast model, because it meets the quality need at lower cost and higher speed.", "Neither; classification cannot be done with AI.", "Whichever has the larger context window."], 1, "When quality is similar on your own test examples, the smaller model wins on cost and speed, which matter at 50,000 tickets a day."], ["In a decision matrix, how is a must-have different from a weight?", ["A must-have counts double.", "A must-have removes an option that fails it, no matter how well it scores elsewhere.", "A must-have only applies to cost.", "There is no difference."], 1, "A weight changes how much a criterion counts in the score. A must-have is a pass or fail rule applied before scoring."], ["A colleague says Model X is number one on a public leaderboard, so it should be used for customer emails. What is the best reply?", ["Agreed; leaderboards measure every task.", "Leaderboards are a starting point; test the top candidates on 10 to 20 of our own emails and check cost, speed and data terms.", "Leaderboards are always wrong.", "Use the second-ranked model to save money."], 1, "Public rankings measure general tasks. The right model does your task well within your cost, speed and data limits, and only testing on your examples shows that."], ["A school district wants to summarize student support notes, which contain personal information about minors. What should come first in choosing a model?", ["Pick the cheapest model with a free tier.", "Pick the model with the largest context window.", "Confirm the district's data rules and contracts, and set must-haves on where data is processed and stored, before scoring options.", "Ask the model whether it is safe to use."], 2, "Data about minors is sensitive and often covered by law and contracts. Must-haves on data handling come before cost or features. A model cannot tell you whether your use complies with your rules."]]};const HTMLC={"C1-M01-L01-lesson": "<h2>Lesson objectives<\/h2>\n<ol>\n<li>Explain what an interpreter does and how a Python program runs line by line.<\/li>\n<li>Follow Python's syntax rules: indentation, comments, keywords and case sensitivity.<\/li>\n<li>Read a syntax error and fix it.<\/li>\n<\/ol>\n<h2>1. Hook<\/h2>\n<p>A school office assistant copies a short Python script from a colleague's email. It fails with <code>IndentationError: unexpected indent<\/code>. The code looks identical. One line starts with a tab and the others with spaces. Python cares about the space at the start of a line, and this lesson shows why.<\/p>\n<h2>2. Explain<\/h2>\n<h3>Interpreted, line by line<\/h3>\n<p>Python is an <strong>interpreted<\/strong> language: the Python interpreter reads your source code (a <code>.py<\/code> file or a notebook cell), checks its syntax, translates it into bytecode and runs it from top to bottom. A <strong>compiled<\/strong> language, such as C, is translated into machine code before it runs. If Python finds a syntax error, nothing in that file runs; if it meets a runtime error halfway, the lines before it have already run.<\/p>\n<h3>Syntax rules you must know<\/h3>\n<table>\n<thead>\n<tr>\n<th>Rule<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Indentation marks blocks<\/td>\n<td>The body of an <code>if<\/code> or <code>def<\/code> is indented, usually 4 spaces<\/td>\n<\/tr>\n<tr>\n<td>Comments start with <code>#<\/code><\/td>\n<td><code># this line is ignored<\/code><\/td>\n<\/tr>\n<tr>\n<td>Names are case sensitive<\/td>\n<td><code>total<\/code> and <code>Total<\/code> are different<\/td>\n<\/tr>\n<tr>\n<td>Keywords are reserved<\/td>\n<td><code>if<\/code>, <code>for<\/code>, <code>def<\/code>, <code>class<\/code>, <code>True<\/code>, <code>None<\/code>, <code>and<\/code>, <code>or<\/code>, <code>not<\/code>, <code>in<\/code>, <code>is<\/code>, <code>return<\/code>... cannot be variable names<\/td>\n<\/tr>\n<tr>\n<td>One statement per line<\/td>\n<td>A line can be continued inside brackets <code>( )<\/code> or with <code>\\<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>import keyword; print(keyword.kwlist)<\/code> lists every keyword.<\/p>\n<h3>Errors<\/h3>\n<p>A <strong>SyntaxError<\/strong> (including <code>IndentationError<\/code>) is found before the program runs. Runtime errors such as <code>NameError<\/code> or <code>ZeroDivisionError<\/code> happen while it runs. Read the last line of the message first.<\/p>\n<p><strong>Exam tip:<\/strong> PCEP questions often show a few lines and ask whether they run, print something, or raise an error. Check indentation and keywords first.<\/p>\n<h3>Key terms in plain language<\/h3>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Source code<\/strong><\/td>\n<td>The instructions you write, in a <code>.py<\/code> file or a notebook cell. It is plain text that people can read.<\/td>\n<\/tr>\n<tr>\n<td><strong>Interpreter<\/strong><\/td>\n<td>The program that reads your Python code and carries it out. When you \"run Python\", you are running the interpreter.<\/td>\n<\/tr>\n<tr>\n<td><strong>Syntax<\/strong><\/td>\n<td>The grammar rules of the language: where colons, brackets, quotes and indentation go. Break a rule and Python cannot understand the line, just as a sentence with jumbled grammar is hard to read.<\/td>\n<\/tr>\n<tr>\n<td><strong>Keyword<\/strong><\/td>\n<td>A word Python has reserved for its own use, such as <code>if<\/code>, <code>for<\/code> or <code>True<\/code>. You cannot use it as a name for your own data.<\/td>\n<\/tr>\n<tr>\n<td><strong>Indentation<\/strong><\/td>\n<td>The spaces at the start of a line. In Python they are not decoration: they show which lines belong together, like the indented steps under a heading in a recipe.<\/td>\n<\/tr>\n<tr>\n<td><strong>Error message<\/strong><\/td>\n<td>Python's report of what went wrong and on which line. The last line names the problem, for example <code>NameError: name 'totl' is not defined<\/code>, which usually means a typo.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. Try it<\/h2>\n<ol>\n<li>Run <code>print(\"Hello\")<\/code> in a new notebook.<\/li>\n<li>Indent the print by two spaces and read the IndentationError.<\/li>\n<li>Try <code>if = 5<\/code> and read the SyntaxError.<\/li>\n<li>Print <code>keyword.kwlist<\/code> and count the keywords.<\/li>\n<\/ol>\n<h2>4. Practice<\/h2>\n<p>Complete the lab <strong>Syntax detective<\/strong>.<\/p>\n<h2>5. Check<\/h2>\n<p>Take the lesson quiz.<\/p>\n<h2>6. Apply<\/h2>\n<p>Write a five-line script that prints your name, your role and the date, with a comment above each line explaining it.<\/p>\n<p><strong>Responsible AI:<\/strong> AI assistants can write Python for you. Why is it still important that you can read and check every line before running it at work?<\/p>", "C1-M01-L01-lab": "<h2>Purpose<\/h2>\n<p>Use Python's own parser to test small snippets, classify each as valid or a syntax error, and list the keywords that cannot be variable names.<\/p>\n<h2>Files<\/h2>\n<ul>\n<li><strong>Starter notebook<\/strong> (with TODO cells): <code>labs/C01-M01-L01-How Python runs your code Lab Starter-v1.ipynb<\/code><\/li>\n<li><strong>Solution notebook<\/strong>: <code>labs/C01-M01-L01-How Python runs your code Lab Solution-v1.ipynb<\/code><\/li>\n<\/ul>\n<h2>Requirements<\/h2>\n<ul>\n<li>Google Colab (free Google account) or Python 3.12 or later on your own computer.<\/li>\n<li>Libraries: Python standard library only.<\/li>\n<li>Time: 20 minutes.<\/li>\n<\/ul>\n<h2>Setup steps<\/h2>\n<ol>\n<li>Open <a href=\"https://colab.research.google.com\" target=\"_blank\" rel=\"noopener\">https://colab.research.google.com<\/a>, choose <strong>File &gt; Upload notebook<\/strong>, and upload the starter notebook from the <code>labs<\/code> folder. Or open it in Jupyter.<\/li>\n<li>Complete the TODO cells: <code>check()<\/code> and <code>is_valid_name()<\/code>.<\/li>\n<li>Choose <strong>Runtime &gt; Run all<\/strong>.<\/li>\n<\/ol>\n<h2>Expected output<\/h2>\n<p>Output of the solution notebook, run on Python 3.13.<\/p>\n<pre><code>35 keywords, for example ['False', 'None', 'True', 'and', 'as']\ngood             OK\nmissing colon    SyntaxError\nbad indent       IndentationError\nkeyword as name  SyntaxError\ncase matters     OK\ntotal        True\n2nd_place    False\nfirst_name   True\nclass        False\n_hidden      True\nmy-name      False\nTotal        True\n<\/code><\/pre>\n<h2>What to notice<\/h2>\n<ul>\n<li><code>compile()<\/code> lets you test whether code is valid without running it.<\/li>\n<li>Mixing tabs and spaces, missing colons and keywords used as names are the common syntax errors.<\/li>\n<li><code>total<\/code> and <code>Total<\/code> are both valid but different names.<\/li>\n<\/ul>\n<h2>Troubleshooting<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Every snippet shows OK<\/td>\n<td>Call compile(code, '<lab>', 'exec') inside try/except SyntaxError.<\/td>\n<\/tr>\n<tr>\n<td>is_valid_name('class') returns True<\/td>\n<td>Also check keyword.iskeyword(name).<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Self-check<\/h2>\n<ul>\n<li>My output matches the expected output.<\/li>\n<li>I can name three syntax rules.<\/li>\n<li>I wrote my five-line script with comments.<\/li>\n<\/ul>", "C1-M01-L02-lesson": "<h2>Lesson objectives<\/h2>\n<ol>\n<li>Write integer, float, string and Boolean literals, including other number bases.<\/li>\n<li>Create variables and explain that a name refers to a value.<\/li>\n<li>Convert between types with int(), float(), str() and bool() and predict the results.<\/li>\n<\/ol>\n<h2>1. Hook<\/h2>\n<p>A clinic's intake script adds the patient's age from a web form to 1 and gets <code>'351'<\/code> instead of <code>36<\/code>. The form value was the text <code>'35'<\/code>, and <code>'35' + '1'<\/code> joins text. One call to <code>int()<\/code> fixes it.<\/p>\n<h2>2. Explain<\/h2>\n<h3>Literals<\/h3>\n<p>A literal is a value written directly in code.<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Examples<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>int<\/code><\/td>\n<td><code>42<\/code>, <code>-7<\/code>, <code>1_000_000<\/code>, <code>0b1010<\/code> (binary), <code>0o17<\/code> (octal), <code>0x1F<\/code> (hex)<\/td>\n<td>Underscores are allowed for readability<\/td>\n<\/tr>\n<tr>\n<td><code>float<\/code><\/td>\n<td><code>3.14<\/code>, <code>2.0<\/code>, <code>1e3<\/code>, <code>.5<\/code><\/td>\n<td><code>1e3<\/code> is 1000.0<\/td>\n<\/tr>\n<tr>\n<td><code>str<\/code><\/td>\n<td><code>'hi'<\/code>, <code>\"hi\"<\/code>, <code>'''multi-line'''<\/code><\/td>\n<td>Single and double quotes are equivalent<\/td>\n<\/tr>\n<tr>\n<td><code>bool<\/code><\/td>\n<td><code>True<\/code>, <code>False<\/code><\/td>\n<td>Capitalised<\/td>\n<\/tr>\n<tr>\n<td><code>NoneType<\/code><\/td>\n<td><code>None<\/code><\/td>\n<td>\"No value\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>type(x)<\/code> tells you a value's type.<\/p>\n<h3>Variables<\/h3>\n<p><code>age = 35<\/code> makes the name <code>age<\/code> refer to the value 35. Assigning again changes what the name refers to. Several at once: <code>a, b = 1, 2<\/code>. Swap: <code>a, b = b, a<\/code>. Shortcut operators: <code>count += 1<\/code>.<\/p>\n<h3>Converting types<\/h3>\n<p><code>int('35')<\/code> gives 35; <code>int(3.9)<\/code> gives 3 (it truncates toward zero); <code>float('2.5')<\/code> gives 2.5; <code>str(10)<\/code> gives <code>'10'<\/code>; <code>bool(0)<\/code>, <code>bool('')<\/code> and <code>bool(None)<\/code> are False, almost everything else is True. <code>int('3.5')<\/code> raises ValueError.<\/p>\n<p><strong>Exam tip:<\/strong> Watch for int() truncation, octal and hex literals, and the difference between 2 and 2.0 in printed output.<\/p>\n<h3>What each type means<\/h3>\n<p>Every value in Python has a <strong>type<\/strong>, which tells Python what kind of thing it is and what you can do with it. You can add two numbers, but adding two pieces of text joins them together. That is exactly what went wrong in the clinic's intake script.<\/p>\n<table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Full name<\/th>\n<th>What it is<\/th>\n<th>Everyday examples<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>int<\/code><\/td>\n<td>integer<\/td>\n<td>A <strong>whole number<\/strong>, with no decimal point. It can be positive, negative or zero, and in Python it can be as large as you need. Use it for things you <strong>count<\/strong>.<\/td>\n<td>Number of students in a class (<code>28<\/code>), age in years (<code>35<\/code>), seats left on a bus (<code>0<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>float<\/code><\/td>\n<td>floating-point number<\/td>\n<td>A number <strong>with a decimal point<\/strong>. Use it for things you <strong>measure<\/strong>, which can fall between whole numbers. <code>2.0<\/code> is a float even though its value is whole. The name comes from the way the computer stores it: the decimal point can \"float\" to any position.<\/td>\n<td>A price (<code>19.99<\/code>), a temperature (<code>36.6<\/code>), an average grade (<code>3.5<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>str<\/code><\/td>\n<td>string<\/td>\n<td><strong>Text<\/strong>: a sequence of characters (letters, digits, spaces, symbols) inside quotes. The name comes from characters strung together like beads. Digits inside quotes are text, not numbers: <code>'35'<\/code> is a string, so you cannot do arithmetic with it until you convert it.<\/td>\n<td>A name (<code>'Amara'<\/code>), a postcode (<code>'20001'<\/code>), a phone number (<code>'571-555-0100'<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>bool<\/code><\/td>\n<td>Boolean<\/td>\n<td>One of exactly two values, <code>True<\/code> or <code>False<\/code>. Use it for <strong>yes-or-no<\/strong> facts. Comparisons produce Booleans: <code>age &gt;= 18<\/code> is either <code>True<\/code> or <code>False<\/code>. Named after the mathematician George Boole.<\/td>\n<td>Has the form been submitted? Is the member active?<\/td>\n<\/tr>\n<tr>\n<td><code>NoneType<\/code><\/td>\n<td>None<\/td>\n<td>The special value <code>None<\/code>, meaning \"<strong>no value here<\/strong>\". It is different from <code>0<\/code> or an empty string.<\/td>\n<td>A middle-name field the person left blank<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why the difference matters<\/strong><\/p>\n<ul>\n<li><code>35 + 1<\/code> gives <code>36<\/code>, but <code>'35' + '1'<\/code> gives <code>'351'<\/code>: with strings, <code>+<\/code> joins text.<\/li>\n<li><code>int('35')<\/code> turns the text into a whole number you can calculate with. <code>float('35')<\/code> gives <code>35.0<\/code>.<\/li>\n<li>Floats are stored in binary, so some decimals cannot be stored exactly: <code>0.1 + 0.2<\/code> prints <code>0.30000000000000004<\/code>. Round floats when you display them, for example <code>round(total, 2)<\/code> for money.<\/li>\n<li>Phone numbers and postcodes should stay strings even though they contain digits: you never add them up, and converting them would drop a leading zero.<\/li>\n<\/ul>\n<p><strong>Other terms in this lesson<\/strong><\/p>\n<ul>\n<li><strong>Literal:<\/strong> a value typed straight into the code, such as <code>42<\/code> or <code>'hello'<\/code>.<\/li>\n<li><strong>Variable:<\/strong> a name that refers to a value, like a label on a box. <code>age = 35<\/code> puts the label <code>age<\/code> on the value 35.<\/li>\n<li><strong>Converting (casting):<\/strong> changing a value from one type to another with <code>int()<\/code>, <code>float()<\/code>, <code>str()<\/code> or <code>bool()<\/code>.<\/li>\n<\/ul>\n<h2>3. Try it<\/h2>\n<ol>\n<li>Print <code>type(1_000)<\/code>, <code>type(1e3)<\/code> and <code>type('1e3')<\/code>.<\/li>\n<li>Convert <code>'35'<\/code> to an int and add 1.<\/li>\n<li>Try <code>int('3.5')<\/code> and read the ValueError, then use <code>int(float('3.5'))<\/code>.<\/li>\n<li>Swap two variables in one line.<\/li>\n<\/ol>\n<h2>4. Practice<\/h2>\n<p>Complete the lab <strong>Fix the form data<\/strong>.<\/p>\n<h2>5. Check<\/h2>\n<p>Take the lesson quiz.<\/p>\n<h2>6. Apply<\/h2>\n<p>Find a form or spreadsheet you use at work. List three fields and the Python type each should become (int, float, str or bool).<\/p>\n<p><strong>Responsible AI:<\/strong> When code converts form data, what should happen to a value that cannot be converted, such as an age typed as 'thirty'? Who should be told?<\/p>", "C1-M01-L02-lab": "<h2>Purpose<\/h2>\n<p>Convert raw text from a fictional intake form into the right Python types, catching values that cannot be converted.<\/p>\n<h2>Files<\/h2>\n<ul>\n<li><strong>Starter notebook<\/strong> (with TODO cells): <code>labs/C01-M01-L02-Literals variables and types Lab Starter-v1.ipynb<\/code><\/li>\n<li><strong>Solution notebook<\/strong>: <code>labs/C01-M01-L02-Literals variables and types Lab Solution-v1.ipynb<\/code><\/li>\n<\/ul>\n<h2>Requirements<\/h2>\n<ul>\n<li>Google Colab (free Google account) or Python 3.12 or later on your own computer.<\/li>\n<li>Libraries: Python standard library only.<\/li>\n<li>Time: 20 minutes.<\/li>\n<\/ul>\n<h2>Setup steps<\/h2>\n<ol>\n<li>Open <a href=\"https://colab.research.google.com\" target=\"_blank\" rel=\"noopener\">https://colab.research.google.com<\/a>, choose <strong>File &gt; Upload notebook<\/strong>, and upload the starter notebook from the <code>labs<\/code> folder. Or open it in Jupyter.<\/li>\n<li>Complete the TODO cells: <code>to_int()<\/code> and <code>to_bool()<\/code>.<\/li>\n<li>Choose <strong>Runtime &gt; Run all<\/strong>.<\/li>\n<\/ol>\n<h2>Expected output<\/h2>\n<p>Output of the solution notebook, run on Python 3.13.<\/p>\n<pre><code>age       '35'      str\nvisits    '3'       str\nbalance   '120.50'  str\ninsured   'yes'     str\nchildren  'two'     str\nemail_ok  'No'      str\n10 15 31 1000 1000.0 3 -3\nage       35      int\nvisits    3       int\nbalance   120.5   float\ninsured   True    bool\nchildren  None    NoneType\nemail_ok  False   bool\nNeeds a person to check: ['children']\nAge next year: 36\n<\/code><\/pre>\n<h2>What to notice<\/h2>\n<ul>\n<li>Every value from a form or file arrives as text and must be converted.<\/li>\n<li>int('3.5') fails, but int(float('3.5')) truncates to 3: make sure that is what you want.<\/li>\n<li>Values that cannot be converted became None and were listed for a person to check.<\/li>\n<\/ul>\n<h2>Troubleshooting<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ValueError stops the notebook<\/td>\n<td>Wrap the conversion in try/except ValueError and return None.<\/td>\n<\/tr>\n<tr>\n<td>to_bool('no') returns True<\/td>\n<td>Compare the lower-case text against a list of yes words; bool('no') is True because the string is not empty.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Self-check<\/h2>\n<ul>\n<li>My output matches the expected output.<\/li>\n<li>I can predict int(), float(), str() and bool() results.<\/li>\n<li>I listed three work fields and their types.<\/li>\n<\/ul>", "C1-M01-L03-lesson": "<h2>Lesson objectives<\/h2>\n<ol>\n<li>Use arithmetic operators, including //, % and **, and predict their results.<\/li>\n<li>Apply operator precedence and associativity correctly.<\/li>\n<li>Read input with input() and control print() output with sep and end.<\/li>\n<\/ol>\n<h2>1. Hook<\/h2>\n<p>A school's lunch-money script divides 47 dollars among 6 students and prints <code>7.833333333333333<\/code>. The cashier wanted 7 dollars each and 5 dollars left over. Two operators, <code>//<\/code> and <code>%<\/code>, give exactly that.<\/p>\n<h2>2. Explain<\/h2>\n<h3>Arithmetic operators<\/h3>\n<table>\n<thead>\n<tr>\n<th>Operator<\/th>\n<th>Meaning<\/th>\n<th>Example<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>+ - *<\/code><\/td>\n<td>add, subtract, multiply<\/td>\n<td><code>2 * 3<\/code><\/td>\n<td><code>6<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>/<\/code><\/td>\n<td>true division (always float)<\/td>\n<td><code>7 / 2<\/code><\/td>\n<td><code>3.5<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>//<\/code><\/td>\n<td>floor division (rounds down)<\/td>\n<td><code>7 // 2<\/code>, <code>-7 // 2<\/code><\/td>\n<td><code>3<\/code>, <code>-4<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>%<\/code><\/td>\n<td>remainder<\/td>\n<td><code>7 % 2<\/code>, <code>-7 % 2<\/code><\/td>\n<td><code>1<\/code>, <code>1<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>**<\/code><\/td>\n<td>power<\/td>\n<td><code>2 ** 3<\/code><\/td>\n<td><code>8<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>If either operand is a float, the result is a float: <code>7 // 2.0<\/code> is <code>3.0<\/code>.<\/p>\n<h3>Precedence<\/h3>\n<p>From highest: <code>**<\/code>, then unary <code>-<\/code>/<code>+<\/code>, then <code>* / // %<\/code>, then <code>+ -<\/code>, then comparisons (<code>== != &lt; &gt; &lt;= &gt;=<\/code>), then <code>not<\/code>, <code>and<\/code>, <code>or<\/code>. <code>**<\/code> is right-associative: <code>2 ** 3 ** 2<\/code> is <code>2 ** 9<\/code> = 512. Other operators go left to right. Note <code>-2 ** 2<\/code> is <code>-4<\/code>. Use brackets when in doubt.<\/p>\n<p>Other operators: comparison returns True/False; <code>and<\/code>, <code>or<\/code>, <code>not<\/code>; bitwise <code>&amp; | ^ ~ &lt;&lt; &gt;&gt;<\/code> (for example <code>5 &amp; 3<\/code> is 1).<\/p>\n<h3>Console input and output<\/h3>\n<p><code>input('Name: ')<\/code> always returns a <strong>string<\/strong>. <code>print(a, b, sep='-', end='!')<\/code> joins with <code>-<\/code> and ends with <code>!<\/code> instead of a new line.<\/p>\n<p><strong>Exam tip:<\/strong> Floor division and modulo with negative numbers, and ** associativity, appear often. Work them out on paper.<\/p>\n<h3>Key terms in plain language<\/h3>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Operator<\/strong><\/td>\n<td>A symbol that does something to values, such as <code>+<\/code> (add) or <code>&gt;<\/code> (greater than).<\/td>\n<\/tr>\n<tr>\n<td><strong>Operand<\/strong><\/td>\n<td>A value an operator works on. In <code>7 + 2<\/code>, the operands are <code>7<\/code> and <code>2<\/code>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Expression<\/strong><\/td>\n<td>Any piece of code that produces a value, such as <code>7 + 2<\/code> or <code>price * 1.2<\/code>. Python works it out, or <strong>evaluates<\/strong> it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Precedence<\/strong><\/td>\n<td>The order in which Python applies operators, like the order of operations in school maths: multiplication before addition.<\/td>\n<\/tr>\n<tr>\n<td><strong>Floor division<\/strong> (<code>//<\/code>)<\/td>\n<td>Division that rounds the answer <strong>down<\/strong> to a whole number. Sharing 7 biscuits among 2 people with <code>7 // 2<\/code> gives each person 3.<\/td>\n<\/tr>\n<tr>\n<td><strong>Remainder or modulo<\/strong> (<code>%<\/code>)<\/td>\n<td>What is left over after floor division. <code>7 % 2<\/code> is <code>1<\/code>: one biscuit left over.<\/td>\n<\/tr>\n<tr>\n<td><strong>Input and output<\/strong><\/td>\n<td>Input is data coming into a program, for example typed by a user with <code>input()<\/code>. Output is what the program shows, for example with <code>print()<\/code>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. Try it<\/h2>\n<ol>\n<li>Work out 47 // 6 and 47 % 6, then check in Python.<\/li>\n<li>Predict <code>2 ** 3 ** 2<\/code> and <code>-2 ** 2<\/code>, then run them.<\/li>\n<li>Print three words joined with sep='/'.<\/li>\n<li>Use input() and multiply the answer by 2; then fix it with int().<\/li>\n<\/ol>\n<h2>4. Practice<\/h2>\n<p>Complete the lab <strong>Split the bill<\/strong>.<\/p>\n<h2>5. Check<\/h2>\n<p>Take the lesson quiz.<\/p>\n<h2>6. Apply<\/h2>\n<p>Write an expression for a calculation you do often at work (a split, a percentage, a rate) and test it on three values.<\/p>\n<p><strong>Responsible AI:<\/strong> If a calculation in your code will be used for money owed by real people, how will you check it before anyone relies on it?<\/p>", "C1-M01-L03-lab": "<h2>Purpose<\/h2>\n<p>Use floor division and modulo to split amounts fairly, check operator precedence, and format console output with sep and end.<\/p>\n<h2>Files<\/h2>\n<ul>\n<li><strong>Starter notebook<\/strong> (with TODO cells): <code>labs/C01-M01-L03-Operators expressions and console IO Lab Starter-v1.ipynb<\/code><\/li>\n<li><strong>Solution notebook<\/strong>: <code>labs/C01-M01-L03-Operators expressions and console IO Lab Solution-v1.ipynb<\/code><\/li>\n<\/ul>\n<h2>Requirements<\/h2>\n<ul>\n<li>Google Colab (free Google account) or Python 3.12 or later on your own computer.<\/li>\n<li>Libraries: Python standard library only.<\/li>\n<li>Time: 20 minutes.<\/li>\n<\/ul>\n<h2>Setup steps<\/h2>\n<ol>\n<li>Open <a href=\"https://colab.research.google.com\" target=\"_blank\" rel=\"noopener\">https://colab.research.google.com<\/a>, choose <strong>File &gt; Upload notebook<\/strong>, and upload the starter notebook from the <code>labs<\/code> folder. Or open it in Jupyter.<\/li>\n<li>Complete the TODO cells: <code>split()<\/code> and <code>cents_split()<\/code>.<\/li>\n<li>Choose <strong>Runtime &gt; Run all<\/strong>.<\/li>\n<\/ol>\n<h2>Expected output<\/h2>\n<p>Output of the solution notebook, run on Python 3.13.<\/p>\n<pre><code>3.5 3 -4 1 1 512 -4 3.0 1\n0.30000000000000004\neach 7 | left over 5\n33.34 + 33.33 + 33.33 = 100.0\n<\/code><\/pre>\n<h2>What to notice<\/h2>\n<ul>\n<li>// and % together give the share and the remainder.<\/li>\n<li>Working in cents (integers) avoids float rounding surprises with money.<\/li>\n<li>print's sep and end change the output without building strings by hand.<\/li>\n<\/ul>\n<h2>Troubleshooting<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The remainder is negative<\/td>\n<td>Use positive amounts; with negative numbers Python's % takes the sign of the divisor.<\/td>\n<\/tr>\n<tr>\n<td>Shares add up to a penny less than the total<\/td>\n<td>Give the leftover cents to the first few people, one each.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Self-check<\/h2>\n<ul>\n<li>My output matches the expected output.<\/li>\n<li>I can predict // and % with negative numbers.<\/li>\n<li>I wrote and tested an expression from my work.<\/li>\n<\/ul>", "C3-M01-L01-lesson": "<h2>Lesson objectives<\/h2>\n<p>By the end of this lesson, you can:<\/p>\n<ol>\n<li>Describe in plain language how a large language model produces text one token at a time.<\/li>\n<li>Explain why the same prompt can give different answers.<\/li>\n<li>Sort workplace tasks into good fits, fits that need checks, and poor fits for generative AI, and give a reason for each.<\/li>\n<\/ol>\n<h2>1. Hook<\/h2>\n<p>A credit union's operations team asks an AI tool to write the subject line for an email: online banking will be down on Saturday from 1 a.m. to 3 a.m. One colleague gets \"Online banking maintenance: Saturday 1 to 3 a.m.\" Another, using the same tool and the same prompt, gets \"Important: Online Banking Maintenance This Weekend.\" The second version goes out. On Saturday morning the call center gets complaints from members who could not tell when the service was down.<\/p>\n<p><strong>Think about it:<\/strong> same tool, same prompt, two different answers. Why? And whose job was it to catch the missing detail?<\/p>\n<h2>2. Explain<\/h2>\n<h3>What a large language model does<\/h3>\n<p>A large language model (LLM) is a program trained on a very large amount of text to do one thing: given the text so far, predict what text is likely to come next. It works in small pieces called tokens, which are often parts of words. To write an answer, it predicts one token, adds it to the text, and predicts the next, until the answer is finished.<\/p>\n<p>The model learned patterns of language, facts and reasoning from its training text. It does not look facts up in a database while it writes, unless the system around it gives it documents or tools. Modules 6 and 8 show how to add those.<\/p>\n<h3>Why answers vary<\/h3>\n<p>At each step the model has a list of possible next tokens, each with a probability. Most AI tools do not always pick the top choice. They sample, which means they pick with some randomness so the writing sounds natural and varied. A setting often called temperature controls how much randomness is used. Lower temperature gives more predictable answers; higher temperature gives more varied ones. Even at low temperature, answers are not guaranteed to be identical every time.<\/p>\n<h3>Generative AI compared with predictive AI<\/h3>\n<p>Many organizations already use predictive AI: models that produce a score or a label, such as a fraud-risk score, a churn prediction, or a no-show risk for clinic appointments. Generative AI produces new content: text, images, code or audio. The two can work together: a predictive model flags a risky transaction and a generative model drafts the note to the reviewer.<\/p>\n<h3>What it does well and what it does poorly<\/h3>\n<table>\n<thead>\n<tr>\n<th>Usually a good fit<\/th>\n<th>Fit, with checks<\/th>\n<th>Poor fit without extra design<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Drafting emails, posts and outlines; rewriting for tone or reading level; summarizing text you provide; brainstorming; explaining or writing simple code<\/td>\n<td>Extracting fields from documents; classifying tickets or feedback; answering questions from your own documents; translating customer-facing text<\/td>\n<td>Exact facts it was not given; recent events after its training data; precise arithmetic on large tables; final decisions about people (hiring, credit, care, grades); anything needing an accountable sign-off<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The middle column is where most real business value is, and it is where this course spends most of its time: adding documents, tests and checks so a useful tool becomes a reliable one.<\/p>\n<h3>Key terms in plain language<\/h3>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Artificial intelligence (AI)<\/strong><\/td>\n<td>Computer systems that do tasks we usually link with human thinking, such as understanding language or spotting patterns.<\/td>\n<\/tr>\n<tr>\n<td><strong>Generative AI<\/strong><\/td>\n<td>AI that <strong>creates new content<\/strong>, such as text, images or code, in response to a request.<\/td>\n<\/tr>\n<tr>\n<td><strong>Predictive AI<\/strong><\/td>\n<td>AI that <strong>makes a prediction or decision<\/strong> from data, for example flagging a likely late payment. It gives a label or a number, not new content.<\/td>\n<\/tr>\n<tr>\n<td><strong>Large language model (LLM)<\/strong><\/td>\n<td>The kind of generative AI behind chat assistants. It learned patterns from a huge amount of text and writes by predicting what comes next, one small piece at a time.<\/td>\n<\/tr>\n<tr>\n<td><strong>Prompt<\/strong><\/td>\n<td>The instructions and text you give the model.<\/td>\n<\/tr>\n<tr>\n<td><strong>Output or response<\/strong><\/td>\n<td>What the model writes back.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. Demonstrate<\/h2>\n<ol>\n<li>Open Google AI Studio (<a href=\"https://aistudio.google.com\" target=\"_blank\" rel=\"noopener\">https://aistudio.google.com<\/a>) and paste the subject-line prompt from the lab.<\/li>\n<li>Run it three times in new chats. Compare the three answers.<\/li>\n<li>Find the temperature setting in the run settings panel. Run twice at a low setting and twice at a high setting. Compare.<\/li>\n<li>Ask the model, \"What time is maintenance on Sunday?\" It may answer confidently about a Sunday that was never mentioned. Lesson 3 explains why.<\/li>\n<\/ol>\n<h2>4. Practice<\/h2>\n<p>Complete the lab <strong>Same prompt, different answers<\/strong>. You write a similarity function and a fact check, then read a report showing which runs kept the day and time.<\/p>\n<h2>5. Check<\/h2>\n<p>Take the lesson quiz. Six questions with instant feedback.<\/p>\n<h2>6. Apply<\/h2>\n<p>List five tasks from your own job and sort them into the three columns: good fit, fit with checks, poor fit. For each \"fit with checks\" task, write the check you would add, such as \"a person confirms every dollar amount\". For one task, note the risk if the AI got it wrong: who would be affected, and how.<\/p>", "C3-M01-L01-lab": "<h2>Purpose<\/h2>\n<p>See for yourself that a language model can give a different answer each time it is asked, and that some answers drop facts the prompt gave it. You build a small check that measures both.<\/p>\n<h2>Files<\/h2>\n<ul>\n<li><strong>Starter notebook<\/strong> (with TODO cells): <code>labs/C03-M01-L01-What generative AI can and cannot do Lab Starter-v1.ipynb<\/code><\/li>\n<li><strong>Solution notebook<\/strong>: <code>labs/C03-M01-L01-What generative AI can and cannot do Lab Solution-v1.ipynb<\/code><\/li>\n<\/ul>\n<h2>Requirements<\/h2>\n<ul>\n<li>Google Colab (free Google account) or Python 3.12 or later on your own computer.<\/li>\n<li>Libraries: none beyond the Python standard library (difflib, itertools).<\/li>\n<li>Optional: Google AI Studio and one other AI chat tool your workplace allows.<\/li>\n<li>Time: 20 to 25 minutes.<\/li>\n<\/ul>\n<h2>Setup steps<\/h2>\n<ol>\n<li>Open <a href=\"https://colab.research.google.com\" target=\"_blank\" rel=\"noopener\">https://colab.research.google.com<\/a>, choose <strong>File &gt; Upload notebook<\/strong>, and upload the starter notebook from the <code>labs<\/code> folder. Or open it in Jupyter on your computer.<\/li>\n<li>Optional: paste the lab prompt into AI Studio and one other tool, three times each, starting a new chat each time. Copy the answers into MY_RESPONSES in Step 1, in the form (\"Model A\", 1, \"answer text\").<\/li>\n<li>Complete the two TODO cells: <code>similarity()<\/code> and <code>facts_kept()<\/code>.<\/li>\n<li>Choose <strong>Runtime &gt; Run all<\/strong>.<\/li>\n<\/ol>\n<h2>Expected output<\/h2>\n<p>Output of the solution notebook, run on Python 3.13. With your own answers the numbers will differ.<\/p>\n<pre><code>Comparing 6 answers from 2 models\n1.0\n{'day': True, 'time': True}\n\nModel A: average similarity between its own runs = 0.49\n  run 1: 11 words | all facts kept\n  run 2: 14 words | all facts kept\n  run 3: 15 words | all facts kept\n\nModel B: average similarity between its own runs = 0.5\n  run 1:  6 words | MISSING: day, time\n  run 2: 10 words | MISSING: day, time\n  run 3:  6 words | all facts kept\n\nAverage similarity between models = 0.44\n<\/code><\/pre>\n<h2>What to notice<\/h2>\n<ul>\n<li>No two runs were the same, even from the same model. Models choose each next word with some randomness.<\/li>\n<li>Model B dropped the day and time in two of three runs. A member reading \"this weekend\" would not know when banking is down.<\/li>\n<li>Similarity scores do not tell you which answer is correct. The fact check does.<\/li>\n<\/ul>\n<h2>Troubleshooting<\/h2>\n<table>\n<thead>\n<tr>\n<th>Problem<\/th>\n<th>Fix<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>NotImplementedError: Finish similarity()<\/td>\n<td>You have not replaced the TODO in Step 2 yet.<\/td>\n<\/tr>\n<tr>\n<td>Similarity is 0.95 where you expect 1.0<\/td>\n<td>Lower-case both answers before comparing them.<\/td>\n<\/tr>\n<tr>\n<td>A fact shows as missing but the answer has it<\/td>\n<td>The answer used different wording, such as \"1am\". Add that phrase to REQUIRED_FACTS.<\/td>\n<\/tr>\n<tr>\n<td>SyntaxError in Step 1<\/td>\n<td>Each answer must be in quotes and each row must end with a comma.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Self-check<\/h2>\n<ul>\n<li>My report runs without errors.<\/li>\n<li>I can explain why the same model gave different answers.<\/li>\n<li>I added two required facts from my own work and ran the check on my own prompt.<\/li>\n<\/ul>", "C3-M01-L02-lesson": "<h2>Lesson objectives<\/h2>\n<ol>\n<li>Explain what a token is and estimate the tokens in a piece of text.<\/li>\n<li>Explain what a context window is and decide whether a task fits in one.<\/li>\n<li>Estimate the monthly cost of a repeated AI task from token counts and published prices.<\/li>\n<\/ol>\n<h2>1. Hook<\/h2>\n<p>A school district's communications lead wants AI to summarize every parent email, about 2,000 a week. Her manager asks two questions: \"How much will this cost?\" and \"Can it read the whole 300-page student handbook to answer parents?\" She does not know how to answer either. By the end of this lesson, you can answer both with numbers. Write down your guess for the monthly cost now.<\/p>\n<h2>2. Explain<\/h2>\n<h3>Tokens<\/h3>\n<p>Models read and write text in tokens. A token can be a whole common word, part of a longer word, a space, or punctuation. Google's Gemini documentation says one token is about 4 characters of English text, and 100 tokens is about 60 to 80 English words. Other providers give similar rules of thumb, but each model family uses its own tokenizer, so exact counts differ. Many non-English languages, code and unusual words use more tokens for the same amount of meaning.<\/p>\n<h3>Context windows<\/h3>\n<p>The context window is the most tokens a model can handle in one request. Everything the model sees counts: your instructions, any documents you paste in, the conversation so far and, for many models, the answer it writes. If the total is larger than the window, the request fails or older text gets dropped.<\/p>\n<p>Google's model page lists a 1 million-token context window for Gemini 4 Argon. That is roughly 1,300 pages of text at 500 words a page. A large window is useful, but it is not perfect memory: research has found that models can miss details placed in the middle of long inputs (Liu et al., \"Lost in the Middle\", 2023). For large document collections, retrieval (Module 6) is usually cheaper and more reliable than pasting everything in.<\/p>\n<h3>Cost<\/h3>\n<p>Hosted models charge per token, with separate prices for input tokens (what you send) and output tokens (what the model writes). Output tokens usually cost several times more. Some models also \"think\" before answering, and Google bills those thinking tokens as output.<\/p>\n<p><strong>Monthly cost<\/strong> = (input tokens per request × requests per month ÷ 1,000,000) × input price + (output tokens per request × requests per month ÷ 1,000,000) × output price.<\/p>\n<p>Example, using Google's paid Standard price for Gemini 3.5 Flash-Lite ($0.30 per million input tokens, $2.50 per million output tokens): summarizing 15,000 short support tickets a month costs about $2.19. Prices change, so always check the current pricing page and date your numbers.<\/p>\n<h3>Four ways to cut cost<\/h3>\n<ul>\n<li>Ask for shorter answers, since output costs more.<\/li>\n<li>Send only the text the model needs, not whole documents.<\/li>\n<li>Use a smaller, cheaper model for simple tasks (Lesson 4).<\/li>\n<li>Reuse results for repeated questions instead of asking again.<\/li>\n<\/ul>\n<h3>Key terms in plain language<\/h3>\n<table>\n<thead>\n<tr>\n<th>Term<\/th>\n<th>What it means<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Token<\/strong><\/td>\n<td>The small unit of text a model reads and writes: a short word, part of a longer word, a space or a punctuation mark. Models count, and charge for, text in tokens rather than words.<\/td>\n<\/tr>\n<tr>\n<td><strong>Tokenizer<\/strong><\/td>\n<td>The tool that splits text into tokens. Each model family has its own, so the same sentence can be a different number of tokens in different models.<\/td>\n<\/tr>\n<tr>\n<td><strong>Input tokens<\/strong><\/td>\n<td>The tokens you send: your prompt plus any documents or chat history.<\/td>\n<\/tr>\n<tr>\n<td><strong>Output tokens<\/strong><\/td>\n<td>The tokens the model writes back. They usually cost more than input tokens.<\/td>\n<\/tr>\n<tr>\n<td><strong>Context window<\/strong><\/td>\n<td>The most tokens a model can take in and produce in one request, input and output together. Think of it as the size of the model's desk: anything that does not fit is not seen.<\/td>\n<\/tr>\n<tr>\n<td><strong>Price per million tokens<\/strong><\/td>\n<td>How AI providers quote prices. $0.30 per million input tokens means sending one million tokens costs 30 cents.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. Demonstrate: the school district answer<\/h2>\n<p>About 8,667 emails a month (2,000 × 52 ÷ 12). Input: 8,667 × 300 tokens = 2.6 million tokens × $0.30 = $0.78. Output: 8,667 × 80 tokens = 0.69 million tokens × $2.50 = $1.73. <strong>Total: about $2.51 a month<\/strong> at these prices. The 300-page handbook, at about 225,000 tokens, fits in a 1 million-token window but not in a 128,000-token one. How close was your guess?<\/p>\n<h2>4. Practice<\/h2>\n<p>Complete the lab <strong>Price a real AI task<\/strong>. You write a token estimator, a monthly cost function and a context-window check.<\/p>\n<h2>5. Check<\/h2>\n<p>Take the lesson quiz.<\/p>\n<h2>6. Apply<\/h2>\n<p>Pick one repeated task from your work, estimate its tokens and volume, and price it for a month with a current price you look up and date. Write one change that would cut the cost in half and say what it would trade away.<\/p>\n<p><strong>Responsible AI:<\/strong> before pasting real work text into any tool to count tokens, check whether it contains personal or confidential data and whether your organization allows that tool.<\/p>", "C3-M01-L02-lab": "<h2>Purpose<\/h2>\n<p>Estimate the tokens in a real support-ticket task, price it for a month, and test whether long documents fit in two context-window sizes.<\/p>\n<h2>Files<\/h2>\n<ul>\n<li><strong>Starter notebook<\/strong>: <code>labs/C03-M01-L02-Tokens context windows and cost Lab Starter-v1.ipynb<\/code><\/li>\n<li><strong>Solution notebook<\/strong>: <code>labs/C03-M01-L02-Tokens context windows and cost Lab Solution-v1.ipynb<\/code><\/li>\n<\/ul>\n<h2>Requirements<\/h2>\n<ul>\n<li>Google Colab or Python 3.12 or later.<\/li>\n<li>Libraries: Python standard library only (math).<\/li>\n<li>Optional Step 5: tiktoken 0.14.0, installed by the notebook. Needs internet access, which Colab has.<\/li>\n<li>Time: 20 to 25 minutes.<\/li>\n<\/ul>\n<h2>Facts used in the lab<\/h2>\n<ul>\n<li>One token is about 4 characters of English text. Source: Google, \"Understand and count tokens\", <a href=\"https://ai.google.dev/gemini-api/docs/tokens\" target=\"_blank\" rel=\"noopener\">https://ai.google.dev/gemini-api/docs/tokens<\/a><\/li>\n<li>Gemini 3.5 Flash-Lite, paid Standard tier: $0.30 per 1 million input tokens and $2.50 per 1 million output tokens. Source: <a href=\"https://ai.google.dev/gemini-api/docs/pricing\" target=\"_blank\" rel=\"noopener\">https://ai.google.dev/gemini-api/docs/pricing<\/a>. Check the page before you rely on these numbers.<\/li>\n<li>The 128,000 and 1,000,000-token window sizes are teaching examples.<\/li>\n<\/ul>\n<h2>Setup steps<\/h2>\n<ol>\n<li>Upload the starter notebook to Colab (<strong>File &gt; Upload notebook<\/strong>) or open it in Jupyter.<\/li>\n<li>Complete the TODO cells: <code>estimate_tokens()<\/code>, <code>monthly_cost()<\/code> and <code>fits()<\/code>.<\/li>\n<li>Choose <strong>Runtime &gt; Run all<\/strong>.<\/li>\n<li>Optional: set <code>RUN_OPTIONAL = True<\/code> in Step 5 to compare the estimate with a real tokenizer.<\/li>\n<\/ol>\n<h2>Expected output<\/h2>\n<p>Output of the solution notebook, run on Python 3.13, with Step 5 left off.<\/p>\n<pre><code>343 characters in the ticket\nInput tokens per ticket:  104\nOutput tokens per ticket: 46\n15,000 tickets a month cost about $2.19\nOutput tokens are 31% of tokens but 79% of the cost\n   50 pages in a   128,000-token window: fits\n   50 pages in a 1,000,000-token window: fits\n  300 pages in a   128,000-token window: does NOT fit\n  300 pages in a 1,000,000-token window: fits\n 1500 pages in a   128,000-token window: does NOT fit\n 1500 pages in a 1,000,000-token window: does NOT fit\nOptional step skipped. Set RUN_OPTIONAL = True to compare with a real tokenizer.\n<\/code><\/pre>\n<p>With <code>RUN_OPTIONAL = True<\/code>, the cell prints \"tiktoken count: N | our estimate: 86\". The real count should be close to the estimate but not equal to it.<\/p>\n<h2>What to notice<\/h2>\n<ul>\n<li>The task costs about $2 a month at this volume. Cost becomes a real question at higher volumes, with longer documents, or with larger models.<\/li>\n<li>Output tokens are about a third of the tokens but nearly four-fifths of the cost.<\/li>\n<li>A 300-page manual fits in a 1 million-token window but not in a 128,000-token one. A 1,500-page archive fits in neither.<\/li>\n<\/u
