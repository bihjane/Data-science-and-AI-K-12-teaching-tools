name = "ifisa-study-buddy"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
MODEL = "claude-haiku-5-5"
# Add your key as a secret (never in this file):
#   npx wrangler secret put ANTHROPIC_API_KEY

# Usage counts and survey answers:
#   npx wrangler kv namespace create STATS   (paste the id below)
#   npx wrangler secret put ADMIN_KEY        (your private key for the App insights page)
[[kv_namespaces]]
binding = "STATS"
id = "PASTE_YOUR_KV_ID_HERE"
